*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;font-size:112.5%}
body{background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:1rem;line-height:1.55;margin:0}

p{margin:0}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:1320px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}

.brand small{color:var(--muted);font-size:.8rem}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:6px 14px;border-radius:999px;cursor:pointer;color:var(--ink-2);font-weight:600;font-size:.92rem;white-space:nowrap}

.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin-bottom:-1px}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:0 0 auto;display:inline-flex;align-items:center;gap:6px;border:0;border-bottom:3px solid transparent;background:transparent;padding:8px 11px 9px;cursor:pointer;color:var(--ink-2);font-weight:600;font-size:.92rem;white-space:nowrap}

main{padding-block:18px 64px}
.view{display:flex;flex-direction:column;gap:18px}
.view>.seg,.view>.row>.seg{align-self:flex-start}
.sec-head{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 16px}
.sec-head p{color:var(--muted);font-size:.88rem;max-width:70ch}

.card{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;min-width:0}
.card > h3{margin-bottom:10px}
.card-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 12px;margin-bottom:12px}

.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.g4{grid-template-columns:repeat(auto-fill,minmax(min(100%,210px),1fr))}
.stack{display:flex;flex-direction:column;gap:10px;min-width:0}
.row{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.muted{color:var(--muted)} .small{font-size:.86rem} .tiny{font-size:.78rem}
.num{font-variant-numeric:tabular-nums}

.st-warn{background:var(--warn-bg);color:var(--warn-ink)} .st-warn .dot{background:var(--warn)}

.flagH,.flagL,.flagA{font-weight:700}

.pivot td{white-space:nowrap}
.pivot td.n{max-width:150px;overflow:hidden;text-overflow:ellipsis}
.pivot td:first-child{white-space:normal}
.pivot th .btn{padding:1px 5px;font-size:.74rem}
/* buttons & fields */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);border-radius:8px;padding:7px 12px;cursor:pointer;font-weight:600;font-size:.88rem;white-space:nowrap;text-decoration:none}

.btn-p{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

.field{display:flex;flex-direction:column;gap:4px;min-width:0}

input[type=text],input[type=number],input[type=search],input[type=date],input[type=month],input[type=datetime-local],select,textarea{background:var(--surface);border:1px solid var(--line-2);border-radius:8px;padding:7px 10px;min-width:0;width:100%}
textarea{min-height:70px;resize:vertical}

.filters{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr));align-items:end}
.checks{display:flex;flex-wrap:wrap;gap:6px}

.checks input{margin:0}
.checks label.on,.fchip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent)}
.fchip .ic{width:16px;height:16px}
/* notes */
.note{border-left:3px solid var(--accent);background:var(--info-bg);padding:9px 12px;border-radius:6px;font-size:.88rem}
.note.warn{border-color:var(--warn);background:var(--warn-bg)}
.note.crit{border-color:var(--crit);background:var(--crit-bg)}
.note.good{border-color:var(--good);background:var(--good-bg)}
ul.plain{margin:0;padding-left:0;list-style:none;display:flex;flex-direction:column;gap:6px}

ul.plain li::before{content:"-";position:absolute;left:0;color:var(--muted)}
.kv{display:grid;grid-template-columns:minmax(110px,max-content) 1fr;gap:4px 14px;font-size:.9rem}
.kv dt{color:var(--muted)} .kv dd{margin:0}
details.more>summary{cursor:pointer;color:var(--accent);font-weight:600;font-size:.88rem;list-style-position:inside}
details.more[open]>summary{margin-bottom:8px}
/* hero */
.hero{display:grid;grid-template-columns:auto minmax(0,1fr) auto;grid-template-areas:'av nm st' 'av fx st';gap:8px 20px;align-items:center}
.hero .avatar{grid-area:av}.hero .h-name{grid-area:nm;align-self:end}.hero .who{grid-area:fx;align-self:start}.hero .stats{grid-area:st}
.avatar{width:68px;height:68px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-family:var(--serif);font-size:1.9rem;font-weight:700;border:2px solid var(--accent-line)}

.stat{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:12px;background:var(--surface-2);border:1px solid transparent;cursor:pointer;text-align:left;min-width:0}

@media (max-width:820px){.hero{grid-template-columns:auto minmax(0,1fr);grid-template-areas:'av nm' 'fx fx' 'st st'}.hero .avatar{width:54px;height:54px;font-size:1.5rem}.hero .h-name{align-self:center}.hero .stats{grid-template-columns:repeat(auto-fit,minmax(min(100%,140px),1fr))}}
/* kpi cards */
.kpis{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr))}
.kpi{background:var(--surface);border-radius:14px;box-shadow:var(--shadow);padding:12px 14px 10px;display:flex;flex-direction:column;gap:6px;cursor:pointer;border:1px solid transparent;text-align:left;min-width:0}

/* zone bar */
.zb{position:relative;height:36px;margin-top:2px;min-width:120px}
.zb .trk{position:absolute;left:0;right:0;top:9px;height:10px;border-radius:5px;overflow:hidden;background:var(--z-none)}
.zb .seg{position:absolute;top:0;bottom:0;display:block}
.z-good{background:var(--z-good)} .z-ok{background:var(--z-ok)} .z-warn{background:var(--z-warn)} .z-serious{background:var(--z-serious)} .z-crit{background:var(--z-crit)} .z-info{background:var(--z-info)} .z-none{background:var(--z-none)}
.zb .mk{position:absolute;top:3px;width:6px;height:22px;margin-left:-3px;border-radius:3px;background:var(--ink);box-shadow:0 0 0 2px var(--surface);display:block}

.lchip.H b{color:var(--crit-ink)} .lchip.L b{color:var(--accent)} .lchip.A b{color:var(--serious-ink)}
/* medication day */

.pill span{min-width:0;overflow-wrap:break-word;hyphens:manual}

.pill.unclear{border:1.5px dashed var(--warn);box-shadow:none}
.medcards{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr))}

/* agenda */
.agenda{display:flex;flex-direction:column;gap:8px}
.ag{display:grid;grid-template-columns:50px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 10px 8px 8px;border-radius:12px;background:var(--surface-2)}

.datebox{width:50px;border-radius:9px;background:var(--surface);text-align:center;box-shadow:var(--shadow);overflow:hidden;line-height:1.15}

/* gantt */
.gantt{display:flex;flex-direction:column}
.g-axis,.g-row{display:grid;grid-template-columns:minmax(150px,250px) minmax(0,1fr) 128px;gap:10px;align-items:center}
.g-axis{font-size:.7rem;color:var(--muted);padding-bottom:4px}

.g-track{position:relative;height:24px}
.g-ticks{position:relative;height:16px}
.g-ticks span{position:absolute;transform:translateX(-50%);white-space:nowrap}
.g-track .base{position:absolute;left:0;right:0;top:11px;height:2px;background:var(--line)}
.g-track .yr{position:absolute;top:2px;bottom:2px;width:0;border-left:1px dashed var(--line-2)}
.g-track .today{position:absolute;top:-3px;bottom:-3px;width:2px;margin-left:-1px;background:var(--accent)}
.g-track .span{position:absolute;top:10px;height:4px;border-radius:2px;background:var(--accent-line)}
.g-track .span.todo{background:repeating-linear-gradient(90deg,var(--z-info) 0 6px,transparent 6px 10px)}
.g-track .last{position:absolute;top:6px;width:13px;height:13px;margin-left:-6.5px;border-radius:50%;background:var(--good);box-shadow:0 0 0 2px var(--surface)}
.g-track .next{position:absolute;top:6px;width:13px;height:13px;margin-left:-6.5px;transform:rotate(45deg);background:var(--surface);border:2.5px solid var(--accent);border-radius:2px}

.g-st{text-align:right}
.g-row.no-track .g-track{opacity:.55}
@media (max-width:700px){.g-axis{grid-template-columns:minmax(0,1fr)}.g-axis>div:first-child,.g-axis>div:last-child{display:none}.g-row{grid-template-columns:minmax(0,1fr) auto}.g-track{grid-column:1/-1;grid-row:2}}
/* alerts */
.alerts{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr))}
.al{border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;border:2px solid}

.rstrip{display:grid;gap:10px;grid-template-columns:repeat(4,minmax(0,1fr))}

/* timeline */

/* entry */

.card.sodo-card{padding:8px 4px 4px}

.lv-fill{fill:none;stroke:var(--sun);stroke-width:10;stroke-linecap:round}
.lv-cap{font:700 12px var(--ui);letter-spacing:2px;fill:var(--ink-2)}
.lv-num{font:700 36px var(--ui);fill:var(--ink)}
.dl-lvtext{display:flex;flex-direction:column;gap:6px;min-width:190px}
.dl-lvtext b{font-family:var(--serif);font-size:1.45rem;color:var(--accent-deep)}
.dl-xp{font-size:1.05rem;font-weight:700;font-variant-numeric:tabular-nums}
.dl-lvtext small{color:var(--ink-2);font-size:.95rem}
.dv-bar{display:block;height:12px;border-radius:999px;background:var(--surface-3);overflow:hidden;min-width:120px}
.dv-bar i{display:block;height:100%;border-radius:999px;background:var(--accent)}
.dv-bar.sun i{background:var(--sun)}
.dv-bar.good i{background:var(--good)}
.dl-prog{display:flex;align-items:center;gap:10px;min-width:220px;font-size:1rem}
.dl-prog .dv-bar{flex:1 1 140px}
.habits{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr));gap:10px}
.habits li{display:flex}
.habits li>.habit{flex:1 1 auto}
.daily .sec-head h3{display:flex;gap:8px;align-items:center}
.habit{width:100%;display:grid;grid-template-columns:auto auto minmax(0,1fr) auto;align-items:center;gap:12px;text-align:left;background:var(--surface-2);border:2px solid transparent;border-radius:16px;padding:12px 14px;min-height:76px;font:inherit;color:inherit}
button.habit{cursor:pointer}
button.habit:hover{border-color:var(--accent-line)}
button.habit:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.hb-check{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:2px solid var(--line-2);color:var(--muted)}
.hb-check .ic{width:22px;height:22px}
.hb-ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--surface);color:var(--accent)}
.hb-ic .ic{width:26px;height:26px}
.hb-txt{display:flex;flex-direction:column;gap:2px;min-width:0}
.hb-txt b{font-size:1.08rem;line-height:1.3}
.hb-txt small{color:var(--ink-2);font-size:.92rem;line-height:1.35}
.hb-xp{font-weight:700;color:var(--sun-deep);font-size:1rem;font-variant-numeric:tabular-nums}
.habit.done{background:var(--accent-soft);border-color:var(--accent-line)}
.habit.done .hb-check{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.habit.auto .hb-check{border-style:dashed}
.habit.auto.done .hb-check{border-style:solid}
.quests{display:flex;flex-direction:column;gap:14px}
.quest{display:flex;flex-direction:column;gap:6px}
.q-top{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.q-top b{font-size:1.04rem}
.q-xp{display:inline-flex;align-items:center;gap:4px;color:var(--sun-deep);font-weight:700;white-space:nowrap}
.quest small{color:var(--ink-2);font-variant-numeric:tabular-nums}
.quest.done .q-xp{color:var(--good-ink)}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.badge{display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;padding:12px 8px;border-radius:14px;background:var(--surface-2);color:var(--muted)}
.badge b{font-size:.98rem;color:var(--ink-2)}
.badge small{font-size:.85rem;line-height:1.3}
.b-medal{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;background:var(--surface-3);color:var(--muted)}
.b-medal .ic{width:28px;height:28px}
.badge.got{background:var(--sun-soft);color:var(--ink-2)}
.badge.got b{color:var(--ink)}
.badge.got .b-medal{background:var(--sun);color:#3d2600;box-shadow:0 0 0 4px var(--surface)}
.focus{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:12px}
.fc{display:flex;flex-direction:column;gap:10px}
.fc-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.fc-top b{font-family:var(--serif);font-size:1.18rem}
.fc-goal,.fc-tip{display:flex;gap:8px;align-items:flex-start;font-size:1rem}
.fc-goal{color:var(--accent-deep);font-weight:600}
.fc-tip{color:var(--ink-2)}
.fc-tip .ic{color:var(--good)}
.fc-now{display:flex;flex-direction:column;gap:2px}
.fc-now .big{font-size:1.8rem}
.remember{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:9px;font-size:1.02rem}
.dl-agenda{display:flex;flex-direction:column;gap:10px}
.ag-row{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:center}
.ag-row b{display:block;font-size:1.04rem}
.ag-row small{color:var(--ink-2);font-size:.95rem}
.dbox{width:58px;min-height:58px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--accent-soft);color:var(--accent-deep);line-height:1.1}
.dbox b{font-size:1.3rem}
.dbox small{font-size:.78rem;font-weight:600}
.dbox.todo{background:var(--sun-soft);color:var(--sun-deep)}
.dl-sos{display:flex;gap:14px;align-items:flex-start;padding:16px 18px;border-radius:16px;background:var(--crit-bg);color:var(--ink);font-size:1.02rem}
.dl-sos .ic{color:var(--crit-ink);flex:0 0 auto}
@media (max-width:720px){
  .dl-hero{grid-template-columns:1fr;padding:18px 16px}
  .dl-level{justify-content:flex-start}
  .lv-ring{width:108px;height:108px;flex-basis:108px}
  .habit{grid-template-columns:auto minmax(0,1fr) auto;padding:12px}
  .habit .hb-ic{display:none}
}

/* Zalo import */
textarea{width:100%;border:1px solid var(--line-2);border-radius:10px;background:var(--surface);padding:10px 12px;font-size:1rem;line-height:1.5;resize:vertical}
textarea:focus-visible{outline:3px solid var(--accent);outline-offset:1px}
table.zl td{vertical-align:middle}
table.zl select{min-height:40px}
.zl-links{display:flex;flex-direction:column;gap:8px;padding:12px 14px;border-radius:12px;background:var(--surface-2)}
.zl-link-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:10px}
.zl-person{display:flex;flex-direction:column;gap:8px;min-width:0;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.zl-top{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.zl-top b{font-size:1rem}
.zl-num{display:inline-flex;align-items:center;gap:5px;font-variant-numeric:tabular-nums;color:var(--ink-2,var(--ink))}
.zl-phone{display:flex;flex-wrap:wrap;align-items:center;gap:6px;flex:1 1 220px;min-width:0}
.zl-phone input{flex:1 1 150px;min-width:0;min-height:36px;border:1px solid var(--line-2);border-radius:8px;background:var(--surface);color:var(--ink);padding:5px 10px;font-size:1rem}
.zl-phone input:focus-visible{outline:3px solid var(--accent);outline-offset:1px}
.zl-act{gap:6px 8px}
.zl-act .btn-p{min-height:40px}
.zl-act .btn[disabled]{opacity:.55;cursor:not-allowed}
.zl-msg summary{cursor:pointer;color:var(--accent);font-weight:600;font-size:.86rem;padding:2px 0}
.zl-msg textarea{margin-top:6px;font-size:.92rem}
</style>

ergy_short":"Chưa ghi nhận dị ứng thuốc","ckm_doc":{"stage":1,"date":"2026-05-18","src":"Toa 18/05/2026"}},"problems":[{"id":"htn","sys":"cardio","status":"active","title":"Tăng huyết áp","detail":"Tự khai tăng huyết áp từ 55 tuổi; huyết áp đo tại phòng khám ở Nhật 11/2022: 112/71 mmHg. Đang dùng Telmisartan 40 mg buổi sáng. Ngày 23/01/2024 chóng mặt, khó thở sau khi tự uống captopril, khám cấp cứu Family Medical Practice: huyết áp 135/65 mmHg, troponin T xét nghiệm nhanh âm tính, điện tim nhịp chậm xoang 57/phút kiểu tái cực sớm. Có cơn 180/100 mmHg ngày 18/01/2025 khi căng thẳng và uống rượu bia. MRI não và mạch máu não FV 05/12/2025: không tổn thương nội sọ, không phình hay hẹp mạch não.","action":"Đo huyết áp tại nhà theo nhật ký; mục tiêu dưới 130/80 mmHg, nếu dung nạp tốt thì 120-129 mmHg tâm thu.","src":"Toa 11/02/2026; FV 12/2025; MEP 11/2022; FMP 01/2024; Sổ theo dõi BS Trung 2025","short":"Tăng huyết áp"},{"id":"lipid","sys":"cardio","status":"active","title":"Rối loạn lipid máu, HDL thấp, có mảng xơ vữa động mạch chi dưới","detail":"Tự khai rối loạn lipid máu từ 40 tuổi. Nhật 11/2022: triglycerid 162 mg/dL (1.83 mmol/L), HDL-C 40 mg/dL, LDL-C 2.35 mmol/L; FV 05/2024: HDL-C 0.39 g/L (1.01 mmol/L), LDL-C 1.89 mmol/L; 12/2024: LDL-C 2.67, HDL-C 1.02. Từ 2025 LDL-C dao động 1.20-3.70 mmol/L: 3.70 ngày 16/04/2026 (cùng triglycerid 7.57 mmol/L, HDL-C 0.77), gần nhất 2.62 (02/10/2026); HDL-C 0.77-1.30. Doppler BV 175 (08/2025): vữa xơ rải rác động mạch chi dưới hai bên, chưa hẹp. Doppler FV 05/12/2025: dày nhẹ nội trung mạc hành động mạch cảnh hai bên (IMT khoảng 1.1 mm), không mảng xơ vữa, không hẹp. Siêu âm động mạch cảnh Nhật 11/2022: thay đổi xơ vữa nhẹ bên phải; baPWV 1447 và 1452 cm/s (tuổi mạch máu 62), ABI 1.31 và 1.17. CT ngực bụng FV 01/2024: không vôi hoá động mạch vành. Đang dùng Atorvastatin 10 mg buổi chiều, đổi từ Rosuvastatin 10 mg theo toa 11/02/2026 để giảm nguy cơ trên thận.","action":"Kế hoạch của BS Trung đặt mục tiêu LDL-C dưới 1.4 mmol/L; theo dõi LDL-C mỗi 3 tháng để BS cân nhắc điều chỉnh điều trị hạ lipid.","src":"XN 2025-2026; BV 175 08/2025; FV 12/2025; Toa 11/02/2026","short":"Mỡ máu, xơ vữa nhẹ"},{"id":"predm","sys":"metabolic","status":"active","title":"Tiền đái tháo đường, kháng insulin","detail":"HbA1c 5.3% (Nhật 11/2022), 6.0% (FV 05/2024), 5.65% (12/2024); từ 2025 dao động 5.64-6.1%, cao nhất 6.1% (12/11/2025), gần nhất 5.93% (02/10/2026). Insulin đói 6.6-16.1 µU/mL.","action":"Giảm tinh bột nhanh và đồ ngọt, vận động 150 phút/tuần, HbA1c mỗi 3-6 tháng.","src":"XN 2025-2026","short":"Tiền đái tháo đường"},{"id":"urate","sys":"kidney","status":"active","title":"Tăng acid uric máu","detail":"Acid uric 428 µmol/L (7.2 mg/dL, Nhật 11/2022), 517 (12/2024), 512 (04/2025), giảm còn 344-373 (10-11/2025), dao động 392-466 trong năm 2026 (gần nhất 439.65 ngày 02/10/2026). Không dùng thuốc hạ acid uric theo mong muốn của chú: bảo vệ thận tối đa, dùng ít thuốc nhất có thể.","action":"Kiểm soát bằng ăn uống: hạn chế bia rượu, nội tạng, thịt đỏ, hải sản có vỏ, nước ngọt có đường; uống đủ nước; mục tiêu dưới 360 µmol/L; acid uric mỗi 3 tháng cùng xét nghiệm thận.","src":"XN 2025-2026; BS Trung 10/2026","short":"Acid uric cao"},{"id":"kidney","sys":"kidney","status":"monitor","title":"Chức năng thận giảm nhẹ (G2), albumin niệu bình thường (A1)","detail":"BS Trung chẩn đoán CKD G2A1 (07/2025). eGFR creatinin-cystatin C 84 (07/2025), 90 (01/2026), 75 (05/2026); ngày 02/10/2026 eGFR creatinin 73 với creatinin 98.6 µmol/L, eGFR cystatin C 85. UACR in trên phiếu luôn dưới 10 mg/g; riêng ngày 09/06/2025, khi đang nhiễm khuẩn tiết niệu, albumin niệu 23.2 mg/L, tính ra khoảng 13.6 mg/g, vẫn dưới 30. eGFR 61 tại Nhật là theo công thức của Nhật, không so trực tiếp được với CKD-EPI. Nang thận trái 9 mm (BV 175), báo cáo Nhật ghi nang phức tạp thận trái. Trước 2025: eGFR creatinin 71.9 (FV 03/2022), 81.3 (FV 05/2024), 82 (12/2024), 66.6 theo công thức Nhật (11/2022). CT toàn thân FV 24/05/2022: vỏ thận mỏng, thận phải 106 mm, thận trái 113 mm, BS đọc nghĩ bệnh thận mạn; nang nhỏ thận trái 6 mm. Siêu âm Nhật 11/2022: vôi hoá thận phải; CT Nhật 11/2022: nghi nang thận trái; CT có cản quang FV 01/2024: nghi nang tỉ trọng cao thận trái 9 mm.","action":"Creatinin, cystatin C, UACR mỗi 3-6 tháng; tránh NSAID kéo dài và thuốc cản quang không cần thiết; phân loại nang thận trái phức tạp theo Bosniak trên CT hoặc MRI.","src":"XN 2022-2026; NCC 02/2026; FV 2022-2024","short":"Thận G2A1"},{"id":"masld","sys":"metabolic","status":"active","title":"Gan nhiễm mỡ","detail":"Tự khai gan nhiễm mỡ từ 45 tuổi. Siêu âm Nhật 11/2022 (mức nhẹ), FV 01/2024, BV 175 (08/2025) và NCC (02/2026): gan nhiễm mỡ. GGT 54 U/L (Nhật 11/2022), 36-56 U/L từ 2024; AST/ALT bình thường. CT mỡ nội tạng tại Nhật 11/2022: 201 cm² (ngưỡng 100), BS Nhật khuyên giảm 4-5 kg. Ferritin 373-490 ng/mL, độ bão hoà transferrin bình thường.","action":"Giảm cân về BMI dưới 23, hạn chế rượu bia; FIB-4 mỗi 1-2 năm.","src":"BV 175; NCC","short":"Gan nhiễm mỡ"},{"id":"spine","sys":"msk","status":"active","title":"Thoái hoá cột sống cổ và thắt lưng, chèn ép rễ","detail":"NCGM Nhật Bản 02/03/2026 (khoa phẫu thuật cột sống): X-quang có gãy xẹp cũ mức độ nhẹ L1, cùng hoá L5; thoát vị đĩa đệm T12/L1 kèm gãy cũ, chèn ép thần kinh nhẹ; nghi bệnh Baastrup L3-L5 có thể viêm; tổn thương trên MRI không tương xứng triệu chứng và không phải nguyên nhân đau thắt lưng. Cột sống cổ: X-quang nghi vôi hoá dây chằng dọc sau (OPLL), MRI hẹp ống sống mức trung bình, chưa có biểu hiện bệnh lý tuỷ. MRI FV 05/12/2025: hẹp ống sống cổ nhiều tầng, thoái hoá Modic loại 2 mặt khớp C6-7, hẹp lỗ liên hợp C3-4 trái, C5-6 và C6-7 hai bên chèn nhẹ rễ; thắt lưng hẹp ống sống tầng T12-L1, cùng hoá L5. MRI BV 175 (08/2025): phình đĩa đệm L4/5 chèn rễ L5 hai bên. Triệu chứng tê dị cảm hai tay, đau lưng lan sau đùi. CT ngực FV 20/05/2024: gai xương bờ sau thân đốt L1 chèn ép tuỷ, hẹp ống sống ngang mức. Tự khai thoát vị đĩa đệm thắt lưng từ 63 tuổi (Nhật 11/2022).","action":"Vật lý trị liệu, tập giãn cơ vai, khớp háng và vận động toàn thân theo NCGM; tránh ngửa cổ quá mức, tránh va chạm vùng cổ, mang vác nặng, cúi gập đột ngột; khám sớm nếu tê yếu tay chân, đi lại vụng về, khó cài cúc áo, rối loạn tiểu tiện (NCGM dặn khi đó cần xem xét phẫu thuật cột sống cổ). Gãy xẹp cũ nhẹ L1: BS cân nhắc đánh giá loãng xương (DEXA BV 175 tính theo quần thể tham chiếu nữ). Pregabalin, Eperisone đã ngưng (BS Trung 10/2026).","src":"MRI FV 12/2025; BV 175; NCGM 02/03/2026","short":"Cột sống cổ, thắt lưng"},{"id":"bone","sys":"msk","status":"monitor","title":"Thiểu xương cổ xương đùi","detail":"DEXA BV 175 (02/08/2025): cổ xương đùi T-score -1.8, cột sống thắt lưng bình thường. Phiếu ghi T-score tính theo quần thể tham chiếu nữ da trắng; khi so sánh các lần đo cần cùng máy, cùng quần thể tham chiếu. Vitamin D 26-32 ng/mL. Đang bổ sung Calci Nano K2. Mật độ xương cẳng tay tại Nhật 11/2022: YAM 88%.","action":"Đo lại mật độ xương sau 2 năm (08/2027); vitamin D mục tiêu 30-50 ng/mL; tập kháng lực.","src":"BV 175 08/2025","short":"Thiểu xương"},{"id":"gerd","sys":"gi","status":"active","title":"Trào ngược dạ dày thực quản, viêm teo dạ dày","detail":"Nội soi NCC 02/2026: viêm thực quản trào ngược LA độ B, thoát vị khe hoành, viêm dạ dày teo, không u. Nội soi FV 15/01/2024: viêm thực quản trào ngược LA độ A, thoát vị khe hoành nhỏ, viêm dạ dày sung huyết, CLO âm tính; sinh thiết viêm mạn nhẹ, H. pylori âm tính (theo sổ BS Sơn). Nội soi Nhật 11/2022: thoát vị khe hoành, viêm thực quản trào ngược, viêm teo dạ dày sau diệt H. pylori lần 1, viêm và trợt tá tràng; kháng thể H. pylori IgG 4 U/mL (ngưỡng dưới 3). Các đợt viêm dạ dày cấp, trào ngược: 11/2023, 01/2024 (cấp cứu FV), 03/2024 (khám FV), 08/2025. Dùng Gaviscon khi có triệu chứng.","action":"Ăn bữa cuối trước khi ngủ 2-3 giờ, kê cao đầu giường, hạn chế rượu bia, cà phê, đồ chua cay; nội soi dạ dày lại mỗi 2-3 năm do viêm teo.","src":"NCC 02/2026; FV 01/2024; MEP 11/2022; Sổ theo dõi BS Sơn 2023-2025","short":"Trào ngược, viêm teo dạ dày"},{"id":"hemorrhoid","sys":"gi","status":"active","title":"Trĩ nội độ II, đi cầu ra máu tái phát","detail":"Các đợt 01/2024, 10/2024, 08/2025, 10/2025, 09/2026. Soi hậu môn FV 16/01/2024: trĩ nội độ 1-2 có dấu đỏ. Nội soi đại tràng FV (09/2026, theo sổ theo dõi): trĩ nội độ II. Nội soi đại tràng Nhật 11/2022 không bất thường.","action":"Uống đủ nước, ăn nhiều chất xơ, tránh táo bón và ngồi lâu; khám ngay khi chảy máu nhiều hoặc phân đen.","src":"Sổ theo dõi BS Trung 2026","short":"Trĩ nội độ II"},{"id":"bph","sys":"uro","status":"monitor","title":"Phì đại lành tính tuyến tiền liệt","detail":"Tự khai phì đại tuyến tiền liệt từ 58 tuổi (Nhật 11/2022). Kích thước trên CT FV 05/2022: 50 x 41 x 31 mm; siêu âm FV 01/2024: khoảng 42 mL; CT FV 01/2024: khoảng 55 cm³. Siêu âm qua ngả trực tràng FV 31/07/2019 chỉ có ảnh trên đĩa phim. Từng dùng Tamsulosin (01/2024). Siêu âm bụng BV 175 (08/2025) ghi tuyến tiền liệt không bất thường. PSA toàn phần 0.98-1.31 ng/mL từ 11/2022; tỷ lệ PSA tự do/toàn phần 0.40-0.54, ở mức thuận lợi.","action":"PSA mỗi 1-2 năm đến 70 tuổi theo quyết định chung với BS.","src":"Sổ theo dõi BS Sơn 2023-2025; XN","short":"Phì đại tuyến tiền liệt"},{"id":"ent","sys":"ent","status":"active","title":"Viêm mũi xoang mạn, viêm thanh quản mạn, polyp dây thanh trái","detail":"Đã mổ mũi xoang và vách ngăn trước đây. Khám TMH 30/01/2026: viêm nhẹ đa xoang, viêm thanh quản mạn, theo dõi polyp dây thanh trái, viêm amidan mạn, nghe kém tiếp nhận rất nhẹ hai tai. Dị nguyên 12/2024: dương tính nhẹ với mạt bụi nhà D. farinae, gián, nấm Alternaria. NCC 02/2026 đề nghị cắt polyp dây thanh trái; PET/MRI có tăng hấp thu FDG ở amidan phải, nghĩ do viêm. MRI não FV 05/12/2025: dày nhẹ niêm mạc xoang hàm và xoang sàng hai bên.","action":"Hẹn chuyên khoa TMH về cắt polyp dây thanh; nội soi kiểm tra amidan phải; hạn chế nói to, la hét.","src":"BV TMH 01/2026; NCC 02/2026; FV 12/2025","short":"Xoang, polyp dây thanh"},{"id":"lung","sys":"resp","status":"monitor","title":"Nốt phổi cũ ổn định","detail":"CT NCC 02/2026: nốt rải rác hai phổi, một số vôi hoá, không đổi so với CT 06/2024, nghĩ sẹo viêm cũ. Các CT trước: FV 05/2022 nốt vôi hoá 1-2 mm hai phổi; Nhật 11/2022 vôi hoá thuỳ trên phải, nốt mờ thuỳ giữa phải và thuỳ dưới trái (bản dịch tiếng Việt ghi nhầm thuỳ giữa trái); FV 01/2024 nốt vôi hoá, nốt 4 mm thuỳ dưới trái; FV 05/2024 vài nốt vôi hoá lành tính (u hạt). X-quang BV 175 (08/2025): nốt mờ nhỏ khoang liên sườn 6/7 phải. KL-6 583 U/mL tăng nhẹ. Đã hút thuốc, bỏ khoảng 30 năm trước.","action":"Theo dõi CT ngực định kỳ theo khuyến cáo của NCC; báo BS nếu ho kéo dài, khó thở.","src":"NCC 02/2026; FV 2022-2024; MEP 11/2022","short":"Nốt phổi cũ"},{"id":"panc","sys":"gi","status":"monitor","title":"Nang tuỵ 6 mm","detail":"Siêu âm NCC 02/2026: nang tuỵ 6 mm, không giãn ống tuỵ chính. CT toàn thân FV 05/2022 ghi tuỵ teo.","action":"MRI tuỵ theo dõi sau 1-2 năm theo chỉ định chuyên khoa.","src":"NCC 02/2026","short":"Nang tuỵ 6 mm"},{"id":"hbv","sys":"infect","status":"monitor","title":"Viêm gan B đã hồi phục, có miễn dịch","detail":"Tự khai viêm gan B năm 15 tuổi, đã khỏi. HBsAg âm tính (Nhật 11/2022 và các lần sau), anti-HBc dương tính, anti-HBs 12.8 (Nhật 11/2022), 528 mIU/mL (02/2026), 174 (10/2026). Đã tiêm nhắc 13/11/2025.","action":"Báo cho BS điều trị biết khi cần dùng corticoid liều cao kéo dài, thuốc ức chế miễn dịch hoặc hoá trị vì nguy cơ tái hoạt virus.","src":"NCC 02/2026; XN","short":"Viêm gan B đã khỏi"},{"id":"esbl","sys":"infect","status":"monitor","title":"Mang vi khuẩn ESBL trong phân; tiền sử nhiễm khuẩn tiết niệu E. coli","detail":"NCC 02/2026 phát hiện vi khuẩn ESBL trong phân. Nhiễm khuẩn tiết niệu dưới do E. coli 06/2025, khỏi với Fosfomycin.","action":"Liên hệ BS trước khi tự dùng kháng sinh; khi sốt kèm tiểu buốt cần cấy nước tiểu.","src":"NCC 02/2026; Sổ theo dõi BS Trung 2025","short":"Mang vi khuẩn ESBL"},{"id":"rhythm","sys":"cardio","status":"history","title":"Cơn nhịp tim nhanh","detail":"Cơn nhịp nhanh tái phát 08/2024, đã đeo Holter 7 ngày tại FV; kết quả Holter cần bổ sung. ECG BV 175 (08/2025): nhịp 67, chưa có kết luận bác sĩ. Siêu âm tim NCC 02/2026: EF 67%, GLS -24.8%, hở van hai lá rất nhẹ. Điện tim FV 11/01/2024: nhịp xoang 79/phút, ST chênh lên kiểu tái cực sớm; Family Medical Practice 23/01/2024: nhịp chậm xoang 57/phút, tái cực sớm; Nhật 11/2022: nhịp 60, bình thường.","action":"Ghi mạch vào nhật ký; Holter ECG và huyết áp 24 giờ đã nằm trong kế hoạch.","src":"Sổ theo dõi BS Sơn 2023-2025; NCC","short":"Cơn nhịp nhanh"},{"id":"pmh","sys":"cardio","status":"history","title":"Tiền sử tự khai khi khám tại Nhật 11/2022: bệnh tim thiếu máu cục bộ, cơn thiếu máu não thoáng qua","detail":"Phiếu khám MEP Tokyo 22/11/2022 ghi các tiền sử do chú khai: bệnh tim thiếu máu cục bộ (phiếu ghi 18 tuổi), cơn thiếu máu não thoáng qua năm 40 tuổi đang theo dõi ngoại trú, viêm loét đại tràng năm 28 tuổi đã điều trị khỏi, viêm gan B năm 15 tuổi đã khỏi, rối loạn lipid máu từ 40 tuổi, tăng huyết áp từ 55 tuổi, gan nhiễm mỡ từ 45 tuổi, phì đại tuyến tiền liệt từ 58 tuổi, thoát vị đĩa đệm thắt lưng từ 63 tuổi. Đĩa phim FV có chụp động mạch vành ngày 07/12/2020 nhưng không kèm phiếu kết quả. CT ngực bụng FV 01/2024 không thấy vôi hoá động mạch vành; MRI não và mạch máu não FV 12/2025 không tổn thương.","action":"Hỏi lại chú và bổ sung phiếu chụp động mạch vành 2020 (có hẹp, có đặt stent hay không). Nếu đã có bệnh mạch vành hoặc cơn thiếu máu não, BS xếp nhóm nguy cơ tim mạch rất cao, phù hợp mục tiêu LDL-C dưới 1.4 mmol/L của kế hoạch hiện tại. Tiền sử viêm loét đại tràng: BS cân nhắc khi lên lịch nội soi đại tràng.","src":"MEP 11/2022; đĩa phim FV 2020","short":"Tiền sử tim mạch tự khai"},{"id":"prl","sys":"endo","status":"monitor","title":"Prolactin tăng một lần, BS nghi kết quả bị sai lệch","detail":"Prolactin 585.2 µIU/mL ngày 02/10/2026 (khoảng tham chiếu nam 86-324), lần đo đầu tiên. FSH, LH, estradiol trong giới hạn. BS Trung nghi kết quả lần này bị sai lệch.","action":"Kiểm tra lại prolactin ở lần xét nghiệm tới: lấy máu buổi sáng, nghỉ ngơi 30 phút trước khi lấy; nếu vẫn tăng thì làm thêm macroprolactin.","src":"XN 02/10/2026; BS Trung 10/2026","short":"Prolactin cần kiểm tra lại"},{"id":"thyroid","sys":"endo","status":"monitor","title":"TSH ở mức thấp của khoảng tham chiếu, FT4 bình thường","detail":"TSH 0.58 µIU/mL tại Nhật 11/2022 (ngưỡng dưới 0.61), FT3 và FT4 bình thường; các lần 12/2024 đến 10/2026 từ 0.57 đến 1.11 µIU/mL, FT4 12.4-18.8 pmol/L. Em gái bị ung thư tuyến giáp. Siêu âm tuyến giáp BV 175 (08/2025) bình thường.","action":"TSH, FT4 cùng các lần xét nghiệm định kỳ; báo BS nếu hồi hộp, sụt cân, run tay.","src":"MEP 11/2022; XN 2024-2026; BV 175","short":"TSH thấp nhẹ"},{"id":"homocys","sys":"cardio","status":"resolved","title":"Tăng homocystein nhẹ đã cải thiện","detail":"15.5 µmol/L (07/2025) giảm còn 12.05 (11/2025). Folate 13.4 ng/mL.","action":"Kiểm tra lại mỗi 6-12 tháng.","src":"XN","short":"Homocystein đã giảm"},{"id":"parasite","sys":"infect","status":"resolved","title":"Toxocara IgG dương tính một lần, nay âm tính","detail":"Toxocara IgG 0.57 OD dương tính (09/12/2024), âm tính 0.10 (02/2025). Toxoplasma IgG 44.13 U/mL dương tính, IgM âm tính (12/2024): đã nhiễm từ trước. Các kháng thể ký sinh trùng khác cùng đợt 12/2024 âm tính.","action":"Không cần điều trị nếu không có triệu chứng; giữ vệ sinh ăn uống và khi tiếp xúc chó mèo.","src":"XN 12/2024, 02/2025","short":"Toxocara đã âm"}],"imaging":[{"date":"2019-07-31","mod":"Siêu âm tuyến tiền liệt qua ngả trực tràng","region":"Tuyến tiền liệt","concl":"Chỉ có ảnh trên đĩa phim ghi 21/11/2022, chưa có phiếu kết quả","place":"BV FV","src":"Đĩa phim FV","docs":[]},{"date":"2020-12-07","mod":"Chụp động mạch vành","region":"Tim","concl":"Chỉ có ảnh trên đĩa phim ghi 21/11/2022, chưa có phiếu kết quả","place":"BV FV","src":"Đĩa phim FV","docs":[]},{"date":"2022-03-08","mod":"X-quang ngực thẳng","region":"Ngực","concl":"Bình thườ d":"date","last":"2026-02-24","months":24},"cat":"exam"},{"item":"Holter ECG 24-48 giờ và huyết áp 24 giờ","freq":"Một lần theo kế hoạch 10/2026","why":"Cơn nhịp nhanh, đánh giá huyết áp thật","due":{"kind":"planned","target":"2026-10"},"cat":"exam"},{"item":"Đo mật độ xương","freq":"Mỗi 2 năm","why":"Thiểu xương cổ xương đùi","due":{"kind":"date","last":"2025-08-02","months":24},"cat":"exam"},{"item":"Khám mắt, đáy mắt","freq":"Mỗi năm","why":"Tăng huyết áp, tiền ĐTĐ, tuổi trên 60","due":{"kind":"none"},"cat":"visit"},{"item":"Khám tai mũi họng","freq":"Mỗi 6 tháng đến khi xử trí polyp","why":"Polyp dây thanh, amidan","due":{"kind":"date","last":"2026-01-30","months":6},"cat":"visit"},{"item":"Khám răng miệng","freq":"Mỗi 6 tháng","why":"Nguy cơ nha chu mức C (xét nghiệm AdoCheck tại Nhật 11/2022)","due":{"kind":"none"},"cat":"visit"},{"item":"Tiêm cúm","freq":"Mỗi năm trước mùa cúm","why":"Người trên 60 tuổi","due":{"kind":"date","last":"2025-01-21","months":12},"cat":"vaccine"},{"item":"Phế cầu","freq":"Theo loại vaccine","why":"Đã tiêm 01/2025 nhưng sổ không ghi tên. PCV20 hoặc PCV21: một liều là đủ; PCV13 hoặc PCV15: cần thêm PPSV23 sau ít nhất 1 năm","due":{"kind":"todo","text":"Ghi tên vaccine phế cầu và zona đã tiêm"},"cat":"vaccine"},{"item":"Uốn ván, bạch hầu (Td hoặc Tdap)","freq":"Mỗi 10 năm","why":"Hồ sơ chưa ghi lần tiêm gần nhất","due":{"kind":"todo","text":"Tiêm nhắc nếu đã trên 10 năm hoặc không nhớ"},"cat":"vaccine"},{"item":"Virus hợp bào hô hấp (RSV)","freq":"Một liều","why":"Khuyến cáo cho người từ 75 tuổi và người 50-74 tuổi có bệnh mạn tính tăng nguy cơ","due":{"kind":"consider","text":"BS cân nhắc"},"cat":"vaccine"}],"targets":[{"param":"Huyết áp tại nhà","code":"SBP","target":"< 130/80 mmHg (120-129 nếu dung nạp)","goal_max":130},{"param":"LDL-C","code":"LDL","target":"< 1.4 mmol/L theo kế hoạch 2025-2027 (một slide ghi < 1.8)","goal_max":1.4},{"param":"Non-HDL-C","code":"NONHDL","target":"< 2.2 mmol/L","goal_max":2.2},{"param":"ApoB","code":"APOB","target":"< 65 mg/dL","goal_max":65},{"param":"HbA1c","code":"HBA1C","target":"< 5.7 %","goal_max":5.7},{"param":"Acid uric","code":"UA","target":"< 360 µmol/L","goal_max":360},{"param":"UACR","code":"UACR","target":"< 30 mg/g (lý tưởng < 10)","goal_max":30},{"param":"Homocystein","code":"HCY","target":"< 15 µmol/L","goal_max":15},{"param":"Vitamin D","code":"VITD","target":"30-50 ng/mL","goal_min":30},{"param":"BMI","code":"BMI","target":"18.5-22.9 kg/m² (ngưỡng châu Á)","goal_max":23}],"advice":[{"topic":"Ăn uống","items":["Theo kiểu DASH kết hợp Địa Trung Hải: nhiều rau xanh, trái cây ít ngọt, ngũ cốc nguyên hạt, cá 2-3 lần/tuần, dầu ô liu, các loại hạt.","Muối dưới 5 g/ngày: bớt nước chấm, nước dùng phở, mì, canh; tránh đồ hộp, đồ chế biến sẵn.","Giảm purin để hạ acid uric: hạn chế nội tạng, thịt đỏ, hải sản có vỏ, bia, nước ngọt có đường fructose.","Đạm khoảng 0.8-1.0 g/kg/ngày (khoảng 55-70 g/ngày), ưu tiên cá, gia cầm bỏ da, đậu.","Uống 2-2.5 lít nước/ngày nếu không có chỉ định hạn chế.","Ăn bữa cuối trước khi ngủ 2-3 giờ để giảm trào ngược."]},{"topic":"Rượu bia","items":["Hạn chế tối đa; nếu buộc phải uống khi tiếp khách, không quá 1-2 ly và có ít nhất 3 ngày không uống mỗi tuần.","Không uống rượu khi đang dùng kháng sinh hoặc thuốc giảm đau thần kinh."]},{"topic":"Vận động","items":["Ít nhất 150 phút/tuần đi bộ nhanh, đạp xe hoặc bơi, chia 5 buổi 30 phút.","Tập kháng lực 2 buổi/tuần với dây kháng lực, tạ nhẹ.","Cột sống: bài tập cơ lõi theo hướng dẫn vật lý trị liệu; tránh nâng vật nặng, cúi gập, xoay vặn đột ngột; nghỉ đứng dậy mỗi 45 phút khi ngồi làm việc.","Theo NCGM 03/2026: tập giãn cơ vùng vai, khớp háng và vận động toàn thân; tránh ngửa cổ quá mức (gội đầu ngửa, bẻ cổ khi xoa bóp), tránh va chạm vùng cổ."]},{"topic":"Dùng thuốc an toàn","items":["Tránh tự dùng thuốc giảm đau nhóm NSAID (ibuprofen, diclofenac, etoricoxib, celecoxib) kéo dài vì hại thận, tăng huyết áp, hại dạ dày; ưu tiên paracetamol.","Khi chụp CT có thuốc cản quang: báo trước để BS kiểm tra creatinin, bù nước trước và sau.","Mang vi khuẩn ESBL: không tự dùng kháng sinh, liên hệ BS khi sốt, tiểu buốt.","Đã từng nhiễm viêm gan B: báo cho BS điều trị trước khi dùng corticoid liều cao kéo dài hoặc thuốc ức chế miễn dịch."]},{"topic":"Đi công tác, du lịch","items":["Mang đủ thuốc thường dùng cộng thêm 7 ngày dự phòng, để trong hành lý xách tay.","Mang máy đo huyết áp; đo sáng và tối, ghi vào nhật ký.","Liên hệ BS Trung khi có triệu chứng bất thường trong chuyến đi."]},{"topic":"Giấc ngủ, căng thẳng","items":["Ngủ 7-8 giờ, hạn chế thức khuya.","Kỹ thuật thở chậm 5 phút khi căng thẳng; cơn tăng huyết áp 01/2025 liên quan căng thẳng và rượu bia."]}],"alerts":[{"lv":3,"cond":"Đau ngực, khó thở, yếu liệt nửa người, nói khó, méo miệng, nhìn mờ đột ngột","act":"Gọi cấp cứu 115"},{"lv":3,"cond":"Đau lưng kèm yếu chân, tê vùng đáy chậu, bí tiểu hoặc tiểu không tự chủ","act":"Đi cấp cứu ngay"},{"lv":3,"cond":"Đi cầu ra máu nhiều, phân đen, chóng mặt hoặc ngất","act":"Đi cấp cứu ngay"},{"lv":2,"cond":"Huyết áp từ 180/110 mmHg, đo lại sau 5 phút vẫn cao","act":"Gọi BS Trung ngay; có triệu chứng mức đỏ thì gọi 115"},{"lv":2,"cond":"Huyết áp dưới 90/60 mmHg kèm choáng váng","act":"Ngồi hoặc nằm nghỉ, uống nước, gọi BS"},{"lv":2,"cond":"Mạch lúc nghỉ dưới 50 hoặc trên 120 lần/phút, hồi hộp kéo dài trên 15 phút","act":"Gọi BS; kèm ngất, đau ngực thì gọi 115"},{"lv":2,"cond":"Sốt kèm tiểu buốt, đau hông lưng","act":"Gọi BS, cấy nước tiểu trước khi dùng kháng sinh"},{"lv":1,"cond":"Huyết áp đo ở nhà trung bình 7 ngày từ 135/85 mmHg","act":"Báo BS để xem xét chỉnh thuốc"},{"lv":1,"cond":"Điểm đau từ 7/10 hoặc đau tăng dần qua 3 ngày","act":"Nhắn tin hoặc gọi BS"},{"lv":1,"cond":"Đi cầu ra máu ít nhưng tái lại","act":"Báo BS, hẹn khám"},{"lv":1,"cond":"Tê bì hoặc yếu tay chân mới xuất hiện, đi lại vụng về, khó cài cúc áo","act":"Báo BS sớm để khám lại cột sống cổ"}],"gaps":["Bổ sung phiếu xét nghiệm MEDLATEC 08/2024 theo sổ BS Sơn (đợt quý 4/2024 đã có phiếu ấp FV 05/12/2025: nốt 3 mm thuỳ giữa phổi phải, nghĩ u hạt lành tính, so với CT trước chỉ còn một nốt; xẹp phổi dạng dải đáy phổi trái; không có hạch nách, trung thất, rốn phổi. CT NCC 24/02/2026: nốt nhỏ thuỳ trên phổi phải không đổi; một chỗ dày nhỏ màng phổi phải chưa rõ nguyên nhân; không có hạch trung thất. CYFRA 21-1: 15.50 (FV 05/2024, ngưỡng 2.37), 4.02 (12/2024), 8.44 (02/2025), 9.96 (04/2025), 4.30 (08/2025), 3.72 ng/mL (NCC 02/2026); SCC 1.6, NSE 15.6 tăng nhẹ; KL-6 609 U/mL tăng. Kháng thể sán lá phổi Paragonimus dương tính 12/2024 (xem mục riêng).","action":"CT ngực theo dõi cùng đợt tầm soát hằng năm; CYFRA 21-1 lặp lại; KL-6 tăng nhẹ: BS cân nhắc đánh giá phổi kẽ nếu có ho, khó thở.","src":"MEP 11/2022; FV 05/2024; CT 07/2025; FV 12/2025; NCC 02/2026","short":"Nốt phổi nhỏ không đổi"},{"id":"axnode","sys":"onco","status":"monitor","title":"Hạch nách trái tăng hấp thu FDG, theo dõi từ 2024","detail":"Siêu âm NCC 24/02/2026: hạch nách trái to, khoảng 24 mm, vỏ dày nhẹ, không đổi so với lần trước. CT: cấu trúc hạch bình thường, nghĩ hạch phản ứng. PET: tích tụ FDG ở hạch nách trái, SUVmax 11.72 (so sánh 25/06/2024) lên 14.56, NCC ghi tương tự lần trước, có tăng nhẹ. sIL-2R 746 U/mL (tham chiếu 204-587) tăng; kết luận NCC không bàn tới sIL-2R. Siêu âm vú FV 05/12/2025 ghi không thấy hạch nách hai bên, khác với siêu âm NCC 24/02/2026.","action":"BS cân nhắc hỏi lại chuyên khoa vú hoặc huyết học: theo dõi tiếp hay sinh thiết hạch, vì SUVmax tăng và sIL-2R tăng; khám ngoại khoa tuyến vú cùng đợt khám tổng quát hằng năm; siêu âm hạch nách trái có chủ đích tại cùng một nơi để so sánh nhất quán.","src":"NCC 02/2026; FV 12/2025","short":"Hạch nách trái"},{"id":"gyn","sys":"onco","status":"monitor","title":"Tiền sử cắt tử cung; HPV nguy cơ cao dương tính năm 2022","detail":"MEP Tokyo 22/11/2022 (bản gốc tiếng Nhật): khám phụ khoa và siêu âm đầu dò không bất thường; tế bào cổ tử cung NILM; HPV 16 và 18 âm tính, HPV nguy cơ cao type khác dương tính, khuyên khám phụ khoa (bản dịch tiếng Việt ghi nhầm là âm tính). Siêu âm FV 20/05/2024 ghi nhận tiền sử cắt tử cung; CT NCC 02/2026 không thấy tử cung. Hồ sơ chưa có năm mổ, lý do và loại phẫu thuật. Tự khai rối loạn tiền mãn kinh năm 50 tuổi.","action":"Hỏi lại dì năm mổ, nơi mổ, lý do, cắt toàn phần hay còn cổ tử cung; nếu còn cổ tử cung hoặc chưa rõ, BS cân nhắc làm lại HPV hoặc Pap.","src":"MEP 11/2022; FV 05/2024; NCC 02/2026","short":"Cắt tử cung, HPV 2022"},{"id":"macro","sys":"heme","status":"monitor","title":"Hồng cầu to nhẹ, không thiếu máu","detail":"MCV 95-101.9 fL, MCH 29.8-33.9 pg (đa số trên 32) từ 2022 đến 2026; NCC 02/2026: MCV 97.8, MCH 33.0, Hb 13.7 g/dL; folate 16.7 ng/mL bình thường; chưa xét nghiệm vitamin B12.","action":"Xét nghiệm vitamin B12; hạn chế rượu; theo dõi CTM mỗi 3-6 tháng.","src":"XN 2025-2026","short":"Hồng cầu to nhẹ"},{"id":"liver","sys":"metabolic","status":"monitor","title":"Men gan AST, ALT tăng nhẹ từng lúc","detail":"FV 05/2024: AST 48, ALT 54 U/L (ngưỡng 35), cao nhất trong hồ sơ; Nhật 11/2022: ALT 36 U/L (ngưỡng 30), AST 30. Tự khai gan nhiễm mỡ năm 55 tuổi; siêu âm Nhật 11/2022 chỉ ghi nang gan, siêu âm FV 05/2024 gan bình thường. Từ 2025 AST 28-36 U/L, nhiều lần vượt nhẹ ngưỡng trên (Diag 31, MEDLATEC 32, BV 175 35 U/L). ALT 28-36 U/L, có lần tăng nhẹ 36.0 U/L ngày 14/07/2026 (ngưỡng 33). NCC 02/2026: AST 32, ALT 31 U/L (ngưỡng Nhật 30 và 23), albumin 3.8 g/dL hơi thấp, GGT 12. Siêu âm bụng BV 175 bình thường; siêu âm NCC 02/2026 chỉ có nang nhỏ ở gan.","action":"Men gan mỗi 3-6 tháng; hạn chế thuốc, thực phẩm chức năng không cần thiết.","src":"XN 2025-2026","short":"Men gan tăng nhẹ"},{"id":"a1c","sys":"metabolic","status":"monitor","title":"HbA1c ở ngưỡng tiền đái tháo đường từng lúc","detail":"HbA1c 4.9% (Nhật 11/2022), 5.7% (FV 05/2024), 5.39% (12/2024); từ 2025 dao động 5.37-5.8%, các lần 07/2025 đến 11/2025 từ 5.7 đến 5.8%, gần nhất 5.69% (10/2026). Glucose đói bình thường.","action":"Giảm đồ ngọt, tinh bột nhanh; HbA1c mỗi 6 tháng.","src":"XN 2025-2026","short":"HbA1c ranh giới"},{"id":"urine","sys":"kidney","status":"monitor","title":"Bạch cầu niệu tăng từng lúc; albumin niệu tăng một lần (12/2024)","detail":"Nhật 11/2022 (bản gốc tiếng Nhật): bạch cầu niệu 20-29/HPF, có vi khuẩn trong cặn lắng. Bạch cầu niệu 3+ (12/2024, 04/2025), 1+ (BV 175 08/2025), âm tính từ 10/2025. UACR 55.86 mg/g ngày 09/12/2024, cùng lúc bạch cầu niệu 3+; các lần 02/2025 đến 10/2026 từ 1.6 đến 7.75 mg/g. eGFR creatinin 78-100.","action":"Khi tiểu buốt, tiểu rắt hoặc sốt: báo BS, cấy nước tiểu trước khi dùng kháng sinh; UACR và tổng phân tích nước tiểu cùng các lần xét nghiệm định kỳ.","src":"MEP 11/2022; XN 2024-2026","short":"Bạch cầu niệu"},{"id":"thyroid","sys":"endo","status":"monitor","title":"Nhân giáp trái TIRADS 2, TSH tăng nhẹ từng lúc","detail":"Siêu âm BV 175 (08/2025): nhân giáp trái 3.3 x 3.1 mm TIRADS 2. TSH 3.08-4.60 µIU/mL, 3 lần vượt nhẹ ngưỡng 4.2 của MEDLATEC (4.38, 4.60, 4.22); NCC 02/2026: TSH 4.24 (IFCC, ngưỡng 4.23), 3.89 theo phương pháp thứ hai; FT4 bình thường; CT, PET không thấy u tuyến giáp. Siêu âm FV 20/05/2024: nhân nhỏ dạng keo hai thuỳ 3-5 mm, TIRADS 2, vài hạch cổ viêm nhỏ hai bên; TSH 1.84 (05/2024), 3.56 (12/2024).","action":"TSH, FT4 mỗi 6-12 tháng; anti-TPO một lần (đã đề nghị khi đi Nhật).","src":"BV 175; XN","short":"Nhân giáp, TSH"},{"id":"parasite","sys":"infect","status":"resolved","title":"Toxocara IgG dương tính, nay âm tính","detail":"Toxocara IgG 0.98 OD (12/2024), 0.40 (02/2025), 0.27 âm tính (04/2025), 0.35 (06/2025, Diag), 0.58 (01/2026), 0.32 vùng chưa xác định (07/2026), 0.25 âm tính (10/2026). Toxoplasma IgG 14.22 U/mL dương tính, IgM âm tính (12/2024): đã nhiễm từ trước.","action":"Giữ vệ sinh khi tiếp xúc chó mèo; không cần điều trị thêm nếu không triệu chứng.","src":"XN 2025-2026","short":"Toxocara đã âm"},{"id":"paragon","sys":"infect","status":"monitor","title":"Kháng thể sán lá phổi Paragonimus dương tính một lần (12/2024)","detail":"Paragonimus IgG 3.21 S/CO (ngưỡng dưới 1, vùng xám 1-1.5) ngày 09/12/2024; các kháng thể ký sinh trùng khác cùng đợt âm tính trừ Toxocara. Bạch cầu ái toan bình thường các lần 2022-2026. CT ngực có nốt nhỏ thuỳ giữa phổi phải nghĩ u hạt (2024-2026), dày màng phổi đáy hai bên (2022). Hồ sơ chưa có kết quả xét nghiệm lại.","action":"Xét nghiệm lại Paragonimus IgG một lần cùng lần lấy máu tới; nếu vẫn dương tính, BS cân nhắc khám chuyên khoa truyền nhiễm, ký sinh trùng.","src":"XN 12/2024","short":"Sán lá phổi IgG dương"},{"id":"skin","sys":"derm","status":"active","title":"Mày đay mạn, viêm da cơ địa, nấm da","detail":"Nhiều đợt ngứa, hồng ban 2025-2026; gói dị ứng 72 dị nguyên âm tính (06/2025); IgE bình thường. BV 175 (08/2025): soi tươi thấy nấm men và sợi nấm.","action":"Kháng histamin khi cần; dưỡng ẩm; tránh dầu gội, mỹ phẩm lạ.","src":"Sổ theo dõi; Diag; BV 175","short":"Mày đay, nấm da"},{"id":"veins","sys":"cardio","status":"monitor","title":"Suy van tĩnh mạch sâu hai chân, tĩnh mạch nông chân phải","detail":"Doppler BV 175 (08/2025). Đĩa phim FV có Doppler tĩnh mạch chi dưới ngày 05/01/2018 (chưa có phiếu kết quả). Tiền sử sưng gót, đau gân Achilles (01/2025).","action":"Vớ áp lực khi đứng lâu, kê cao chân, tập bắp chân.","src":"BV 175","short":"Suy van tĩnh mạch"},{"id":"knee","sys":"msk","status":"active","title":"Thoái hoá khớp gối hai bên, viêm khớp bánh chè - đùi mức độ nhẹ","detail":"NCGM Nhật Bản 02/03/2026: đau trước gối hai bên khoảng 2 năm, lạo xạo khi lên xuống cầu thang, đứng lên ngồi xuống; X-quang và MRI: viêm khớp bánh chè - đùi (nhuyễn sụn bánh chè) hai bên mức độ nhẹ, chưa biến dạng khớp, chưa cần phẫu thuật. Đã tiêm PRP khớp gối (07/2025), kế hoạch PRP lần 3; đau cổ vai gáy. Phần đầu bản dịch NCGM in nhầm ngày sinh, mã bệnh nhân của chú Minh; nội dung khám là của dì (đã đối chiếu).","action":"Tập tăng sức cơ tứ đầu đùi theo hướng dẫn của NCGM, giữ cân nặng; tránh ngồi xổm sâu, quỳ gối lâu, leo cầu thang nhiều; hạn chế NSAID kéo dài.","src":"NCGM 02/03/2026; Sổ theo dõi","short":"Thoái hoá gối"},{"id":"spine","sys":"msk","status":"monitor","title":"Thoái hoá cột sống cổ, hẹp ống sống chủ yếu C5-6; thoái hoá đĩa đệm thắt lưng nhẹ","detail":"MRI FV 05/12/2025 (chỉ định vì đau cổ): mất nước đĩa đệm các tầng, gai xương; thoát vị nhẹ trung tâm C2-3; phình đĩa gây hẹp ống sống C3-4, C4-5 và C5-6 (đường kính trước sau còn 8 mm ở C5-6); hẹp lỗ liên hợp C3-4 trái và C5-6 hai bên chạm rễ thần kinh; tuỷ sống không thay đổi tín hiệu. MRI thắt lưng: phình nhẹ đĩa đệm L3-4, L4-5, L5-S1, không chèn ép rễ, không hẹp ống sống; thoái hoá khớp mặt nhẹ nhiều tầng. Sổ theo dõi có ghi đau cổ vai gáy.","action":"Tập vận động cổ vai và tư thế theo hướng dẫn vật lý trị liệu; tránh ngửa cổ quá mức, mang vác nặng, cúi xem điện thoại lâu; khám sớm nếu tê hoặc yếu tay, đi lại vụng về, khó cài cúc áo.","src":"FV 05/12/2025","short":"Cột sống cổ, thắt lưng"},{"id":"gerd","sys":"gi","status":"monitor","title":"Trào ngược dạ dày thực quản, viêm dạ dày nhẹ, viêm họng mạn","detail":"Báo cáo y khoa FV 05/2024: viêm dạ dày, trào ngược, triệu chứng chưa cải thiện. Nội soi FV 20/05/2024: viêm trợt sung huyết hang vị, CLO âm tính; giải phẫu bệnh 27/05/2024: viêm mạn rất nhẹ không hoạt động, H. pylori âm tính, không teo (OLGA 0), không dị sản ruột (OLGIM 0). Nội soi Nhật 11/2022: polyp tuyến đáy vị; H. pylori IgG 8 U/mL (ngưỡng dưới 3). Pepsinogen I 44.51 ng/mL thấp, tỷ lệ I/II 3.47 (12/2024). Nội soi thanh quản BV 175 (08/2025): viêm họng mạn tính, hội chứng trào ngược.","action":"Ăn bữa tối sớm, hạn chế đồ chua cay, cà phê; nội soi dạ dày theo lịch tầm soát.","src":"MEP 11/2022; FV 05/2024; XN 12/2024; BV 175","short":"Trào ngược, viêm dạ dày nhẹ"},{"id":"valve","sys":"cardio","status":"monitor","title":"Hở van hai lá, ba lá nhẹ","detail":"Siêu âm tim BV 175 (08/2025): EF 66%, PAPs 21 mmHg. Siêu âm tim NCC 24/02/2026: chức năng thất trái bình thường, EF 68-71%, GLS -23.7%; hở van hai lá nhẹ, van động mạch phổi và ba lá rất nhẹ; RVSP 31 mmHg. NT-proBNP 26-78 pg <script>
/* ===================== Kho số đo chung: phần dùng chung của trang Sổ đo và bảng theo dõi =====================
   1. Mã truy cập riêng của từng người (24 byte ngẫu nhiên, mã hoá base64url) nằm trong phần sau dấu # của liên kết, dạng #minh.MÃ.
      Phần sau dấu # không đi lên máy chủ trong địa chỉ. Trang lưu mã trong localStorage, mục riêng, không lẫn với số liệu.
   2. Gộp nhật ký thao tác (tạo, sửa, xoá) lấy từ kho vào danh sách số đo của một người. Kết quả không phụ thuộc thứ tự nhận:
        - mỗi mục có số lần sửa rev; bản rev cao hơn thắng;
        - xoá thắng khi rev bằng nhau hoặc cao hơn; mục đã xoá được nhớ trong bảng tomb để thao tác cũ đến muộn không làm nó sống lại;
        - cùng rev mà nội dung khác nhau (hai máy sửa cùng lúc): thói quen lấy hợp hai danh sách việc đã làm, loại khác lấy bản có chuỗi
          chuẩn hoá lớn hơn. Mọi máy chọn giống nhau nên cuối cùng hội tụ. */
var SODOLOG = (function () {
  var KEY = 'so-do-tai-nha-key-v1';
  var TOKEN_RE = /^[A-Za-z0-9_-]{16,64}$/;

  function readKeys() {
    try { var o = JSON.parse(window.localStorage.getItem(KEY) || '{}'); return o && typeof o === 'object' && !Array.isArray(o) ? o : {}; } catch (e) { return {}; }
  }
  function writeKeys(o) { try { window.localStorage.setItem(KEY, JSON.stringify(o)); return true; } catch (e) { return false; } }
  // who: mã người (LTM, DTG) hoặc 'ADMIN'
  function getKey(who) { var t = readKeys()[who]; return typeof t === 'string' && TOKEN_RE.test(t) ? t : ''; }
  function setKey(who, token) {
    if (!TOKEN_RE.test(String(token || ''))) return false;
    var o = readKeys(); if (o[who] === token) return true;

  }
  function dropKey(who) { var o = readKeys(); delete o[who]; writeKeys(o); }
  // '#minh.MÃ' -> { slug: 'minh', token: 'MÃ' }; '#minh' -> { slug: 'minh', token: '' }
  function parseHash(h) {
    h = String(h || '').replace(/^#/, '');
    var i = h.indexOf('.'), tok = i < 0 ? '' : h.slice(i + 1);

  function clone(x) { return JSON.parse(JSON.stringify(x)); }
  function stable(o) {

  /* merge(list, tomb, ops, opt): list là mảng số đo của một người (sửa tại chỗ), tomb là { id: rev đã xoá } (sửa tại chỗ),
     ops là các thao tác từ kho, mỗi thao tác { op, rev, dev, e }. opt.dev là mã máy này.
     opt.mine (tuỳ chọn, sửa tại chỗ) là { id: rev } các bản do chính máy này vừa lưu mà kho chưa trả về; khi thao tác của chính máy này
     trở về cùng rev và bản trong danh sách vẫn là bản tự lưu, thì lấy bản kho đã làm sạch. Nếu bản đó đã bị bản của máy khác thay thế
     thì thao tác của chính máy này đi qua cùng quy tắc với mọi thao tác khác, để mọi máy chọn giống nhau.
     Trả về { added, replaced, removed: [id], seen: { id: rev cao nhất kho đang giữ cho mục này (không tính xoá) } }. */
  function merge(list, tomb, ops, opt) {
    var me = (opt && opt.dev) || '', mine = (opt && opt.mine) || {}, out = { added: [], replaced: [], removed: [], seen: {} };

// so a reading deleted in Sổ đo disappears here too. Same id in several sources: the higher revision wins; on a tie the store beats the file, and this browser's Sổ đo beats the file.
// A delete the store holds (tomb) removes the file's and this browser's copy at that revision or lower.

    var by = {}, mine = {}, lv = (typeof LIVE !== 'undefined' && LIVE && LIVE.by[p]) || null, tb = lv ? lv.tomb : {};
    var gone = function (e) { return tb[e.id] != null && tb[e.id] >= (e.rev || 1); };
    (st[p] || []).forEach(function (e) { if (e.type === 'habit') mine[dayOf(e)] = true; });
    if (lv) lv.list.forEach(function (e) { if (e.type === 'habit') mine[dayOf(e)] = true; });
    (lg[p] || []).filter(function (e) { return e.src !== 'csv' && e.src !== 'sodo' && e.src !== 'store'; }).forEach(function (e) { by[e.id] = e; });

async function addLogEntry(pid, entry) {

    var arr = lsGet(LOCAL_KEY, []); if (!Array.isArray(arr)) arr = [];
    var e2 = Object.assign({ id: id, local: true }, entry); arr.push(e2); lsSet(LOCAL_KEY, arr);
    if (!S.db) setLogs(loadLocal()); else { S.logs[pid].push(e2); invalidate(); scheduleRender(); }
    return { local: true };
  }
  var ym = entry.t.slice(0, 7), ref = S.db.doc('logs/' + pid + '_' + ym), payload = { entries: {} };
  payload.entries[id] = entry;
  return queued(async function () {
    try { await ref.update(payload); return { ok: true }; }
    catch (e) {

      if (e && (e.code === 'invalid_argument' || e.code === 'transform_error')) {
        var snap = await ref.get();

        var s2 = await ref.get(), dd = s2.exists && s2.data();

}

var LIBS = { docx: 'https://cdn.jsdelivr.net/npm/docx@8.5.0/build/index.umd.js', html2pdf: 'https://cdn.jsdelivr.net/npm/html2pdf.js@0.10.1/dist/html2pdf.bundle.min.js' };

function loadLib(name) {
  if (name === 'docx' && window.docx) return Promise.resolve();
  if (name === 'html2pdf' && window.html2pdf) return Promise.resolve();
  if (libPromises[name]) return libPromises[name];
  libPromises[name] = new Promise(function (res, rej) {
    var s = document.createElement('script'); s.src = LIBS[name]; s.async = true;
    s.onload = function () { res(); }; s.onerror = function () { libPromises[name] = null; rej(new Error('load ' + name)); };
    document.head.appendChild(s);
  });
  return libPromises[name];
}

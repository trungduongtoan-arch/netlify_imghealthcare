<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#0b7d6e" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#15201d" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-title" content="Sổ đo">
<link rel="icon" href="/so-do/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/so-do/icon-180.png">
<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
<title>Sổ đo tại nhà</title>
<meta name="description" content="Sổ ghi số đo, thói quen mỗi ngày; số đo tự gửi về cho bác sĩ">
<meta name="sdtn-page" content="5">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Arimo:wght@400;600;700&family=Tinos:wght@400;700&display=swap&subset=vietnamese">
<style>
[hidden]{display:none!important}
:root{
  
  --bg:#f3f8f6; --surface:#ffffff; --surface-2:#eaf3ef; --surface-3:#dcebe4;
  --ink:#14261f; --ink-2:#38514a; --muted:#56706a; --line:#d8e7e0; --line-2:#bcd4ca;
  --accent:#0b7d6e; --accent-ink:#ffffff; --accent-soft:#dcf1eb; --accent-line:#93d0c2; --accent-deep:#07665a;
  --sun:#f5a524; --sun-soft:#fff3d6; --sun-deep:#a35f00;
  --hero:linear-gradient(135deg,#dff4ec 0%,#f2faf6 55%,#fff4dc 100%);
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#6250d6; --s5:#9a7b4f;
  --good:#0ca30c; --warn:#fab219; --serious:#ec835a; --crit:#d03b3b;
  --good-ink:#0a6a0a; --warn-ink:#7d5200; --serious-ink:#9a4620; --crit-ink:#a32626;
  --good-bg:#e6f4e4; --warn-bg:#fdf1d6; --serious-bg:#fbe7de; --crit-bg:#f8e0de; --info-bg:#e0f2ee;
  --z-good:#bfe3bb; --z-ok:#dcefd6; --z-warn:#f9df94; --z-serious:#f4bc9e; --z-crit:#ec9e9e; --z-info:#c4e6de; --z-none:#e3e9e6;
  --band:rgba(12,163,12,.09); --chart:#fcfdfc; --grid:#e3ece8; --axis:#bccbc4; --target:#6250d6;
  --shadow:0 1px 2px rgba(16,40,32,.06), 0 0 0 1px rgba(16,40,32,.045);
  --radius:14px;
  --ui:Arial, Arimo, "Liberation Sans", Helvetica, sans-serif;
  --serif:"Times New Roman", Tinos, "Liberation Serif", Times, serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1614; --surface:#15201d; --surface-2:#1b2925; --surface-3:#22332e;
    --ink:#e6f1ed; --ink-2:#bfd3cc; --muted:#8fa69f; --line:#24342f; --line-2:#33463f;
    --accent:#4fd1b5; --accent-ink:#05231d; --accent-soft:#123a32; --accent-line:#2b6a5c; --accent-deep:#7fe0c9;
    --sun:#f7b84a; --sun-soft:#3a2c10; --sun-deep:#ffcf7a;
    --hero:linear-gradient(135deg,#12332b 0%,#15201d 55%,#33280f 100%);
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#9085e9; --s5:#b8996b;
    --good-ink:#5fd35f; --warn-ink:#f6c25a; --serious-ink:#f09a76; --crit-ink:#ff8a8a;
    --good-bg:#16301a; --warn-bg:#352a10; --serious-bg:#3a2218; --crit-bg:#3d1c1c; --info-bg:#143029;
    --z-good:#2a5a2e; --z-ok:#24402a; --z-warn:#6b5419; --z-serious:#6e3b24; --z-crit:#6e2b2b; --z-info:#1f4a41; --z-none:#2a3532;
    --band:rgba(12,163,12,.16); --chart:#141e1b; --grid:#22302c; --axis:#3d4f49; --target:#9085e9;
    --shadow:0 0 0 1px rgba(255,255,255,.06);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1614; --surface:#15201d; --surface-2:#1b2925; --surface-3:#22332e;
  --ink:#e6f1ed; --ink-2:#bfd3cc; --muted:#8fa69f; --line:#24342f; --line-2:#33463f;
  --accent:#4fd1b5; --accent-ink:#05231d; --accent-soft:#123a32; --accent-line:#2b6a5c; --accent-deep:#7fe0c9;
  --sun:#f7b84a; --sun-soft:#3a2c10; --sun-deep:#ffcf7a;
  --hero:linear-gradient(135deg,#12332b 0%,#15201d 55%,#33280f 100%);
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#9085e9; --s5:#b8996b;
  --good-ink:#5fd35f; --warn-ink:#f6c25a; --serious-ink:#f09a76; --crit-ink:#ff8a8a;
  --good-bg:#16301a; --warn-bg:#352a10; --serious-bg:#3a2218; --crit-bg:#3d1c1c; --info-bg:#143029;
  --z-good:#2a5a2e; --z-ok:#24402a; --z-warn:#6b5419; --z-serious:#6e3b24; --z-crit:#6e2b2b; --z-info:#1f4a41; --z-none:#2a3532;
  --band:rgba(12,163,12,.16); --chart:#141e1b; --grid:#22302c; --axis:#3d4f49; --target:#9085e9;
  --shadow:0 0 0 1px rgba(255,255,255,.06);
  color-scheme:dark;
}

/* ===== Sổ đo tại nhà: base, sized for readers over 60 (20px base on phones) ===== */
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;font-size:125%}
@media (min-width:900px){html{font-size:118.75%}}
body{background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:1rem;line-height:1.55;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--surface);z-index:30}
h1,h2,h3,h4{font-family:var(--serif);font-weight:700;line-height:1.25;text-wrap:balance;margin:0}
h2{font-size:1.4rem} h3{font-size:1.15rem}
p{margin:0}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:860px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.ic{width:22px;height:22px;flex:0 0 auto;display:inline-block;vertical-align:middle}
.ic.sm{width:18px;height:18px} .ic.lg{width:28px;height:28px} .ic.xl{width:36px;height:36px}
.muted{color:var(--muted)} .small{font-size:.86rem} .tiny{font-size:.78rem}
.num{font-variant-numeric:tabular-nums}
.big{font-size:1.9rem;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.big small{font-size:.8rem;font-weight:400;color:var(--muted);margin-left:4px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.card{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;min-width:0}
.card-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 12px;margin-bottom:12px}
.card-head h3{display:flex;align-items:center;gap:8px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr))}
.stack{display:flex;flex-direction:column;gap:12px;min-width:0}
.row{display:flex;flex-wrap:wrap;gap:10px 12px;align-items:center}
.sec-head{display:flex;flex-direction:column;gap:4px}
.sec-head p{color:var(--ink-2);font-size:.95rem;max-width:62ch}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 11px 3px 9px;font-size:.82rem;font-weight:700;white-space:nowrap;line-height:1.5}
.chip .dot{width:9px;height:9px;border-radius:50%;flex:0 0 9px}
.st-good{background:var(--good-bg);color:var(--good-ink)} .st-good .dot{background:var(--good)}
.st-warn{background:var(--warn-bg);color:var(--warn-ink)} .st-warn .dot{background:var(--warn)}
.st-crit{background:var(--crit-bg);color:var(--crit-ink)} .st-crit .dot{background:var(--crit)}
.st-info{background:var(--info-bg);color:var(--accent-deep)} .st-info .dot{background:var(--accent)}
.st-none{background:var(--surface-2);color:var(--ink-2)} .st-none .dot{background:var(--line-2)}
.note{border-left:4px solid var(--accent);background:var(--info-bg);padding:12px 14px;border-radius:8px;font-size:.95rem}
.note.warn{border-color:var(--warn);background:var(--warn-bg)}
.note.crit{border-color:var(--crit);background:var(--crit-bg)}
.note.good{border-color:var(--good);background:var(--good-bg)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:2px solid var(--line-2);background:var(--surface);color:var(--ink);border-radius:12px;padding:10px 16px;min-height:52px;cursor:pointer;font-weight:700;font-size:1rem;text-align:center;line-height:1.25}
.btn:hover{border-color:var(--accent)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-p{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn-p:hover{filter:brightness(1.06)}
.btn-ghost{border-color:transparent;background:transparent;color:var(--accent-deep)}
.btn-xl{width:100%;min-height:62px;font-size:1.12rem;border-radius:14px}
a.btn{text-decoration:none}
.zl-no{font-variant-numeric:tabular-nums;white-space:nowrap}
.btn-danger{color:var(--crit-ink);border-color:var(--crit-bg)}
button:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.toast{position:fixed;left:50%;bottom:calc(98px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;font-size:1rem;font-weight:700;z-index:90;max-width:calc(100% - 32px);box-shadow:0 6px 20px rgba(0,0,0,.25);text-align:center}

/* ===== header and bottom navigation ===== */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-block:10px}
.brand{display:flex;flex-direction:column;min-width:0}
.brand-k{font-family:var(--serif);font-weight:700;font-size:.9rem;letter-spacing:.08em;text-transform:uppercase;color:var(--accent-deep)}
.brand b{font-size:1.15rem;line-height:1.2}
.top .btn{min-height:46px;padding:6px 12px;font-size:.92rem}
main{padding-block:18px calc(112px + env(safe-area-inset-bottom,0px))}
.screen{display:flex;flex-direction:column;gap:18px}
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);box-shadow:0 -4px 16px rgba(16,40,32,.06);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.bnav-in{max-width:860px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.bnav button{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:74px;border:0;border-top:4px solid transparent;background:transparent;color:var(--ink-2);font-weight:700;font-size:.8rem;cursor:pointer;padding:6px 2px;line-height:1.15}
.bnav button .ic{width:28px;height:28px}
.bnav button[aria-current="page"]{color:var(--accent-deep);border-top-color:var(--accent);background:var(--accent-soft)}
.bnav .count{position:absolute;top:6px;left:calc(50% + 8px);min-width:24px;height:24px;border-radius:12px;background:var(--sun);color:#3d2600;font-size:.78rem;display:grid;place-items:center;padding:0 6px}

/* ===== who is using ===== */
.chooser{display:flex;flex-direction:column;gap:16px;padding-top:12px}
.chooser h2{font-size:1.6rem}
.who-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:14px}
.who{display:flex;align-items:center;gap:16px;padding:20px;border-radius:18px;border:2px solid var(--line-2);background:var(--surface);cursor:pointer;text-align:left;min-height:96px;font-size:1.35rem;font-weight:700;font-family:var(--serif)}
.who:hover{border-color:var(--accent)}
.who .av{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent-deep);flex:0 0 58px}
.who .av .ic{width:30px;height:30px}

/* ===== entry forms ===== */
input[type=date],input[type=time],textarea,input[type=text]{background:var(--surface);border:2px solid var(--line-2);border-radius:12px;padding:10px 12px;min-height:56px;font-size:1.05rem;width:100%;min-width:0}

.kinds{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,140px),1fr));gap:10px}
@media (max-width:520px){.kinds{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kind{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:92px;padding:10px 6px;border-radius:16px;border:2px solid var(--line);background:var(--surface);color:var(--ink);font-weight:700;font-size:1rem;cursor:pointer;text-align:center;line-height:1.2}
.kind .ic{width:32px;height:32px;color:var(--accent)}
.kind[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.kind[aria-pressed="true"] .ic{color:var(--accent-ink)}
.form{display:flex;flex-direction:column;gap:18px}
.form h3{display:flex;align-items:center;gap:10px;font-size:1.25rem}
fieldset{border:0;margin:0;padding:0;min-width:0;display:flex;flex-direction:column;gap:10px}
legend{font-weight:700;font-size:1.02rem;padding:0;margin-bottom:10px}
.numgrid{display:flex;flex-direction:column;gap:12px}
.numf{display:grid;grid-template-columns:minmax(0,1fr) auto auto;align-items:center;gap:6px 12px;padding:10px 12px;border-radius:14px;background:var(--surface-2)}
.numf .nl{display:flex;flex-direction:column;font-weight:700;font-size:1.05rem;line-height:1.25}
.numf .nl small{font-weight:400;font-size:.84rem;color:var(--ink-2)}
.numf input[type=text]{width:5.2ch;font-size:1.9rem;font-weight:700;text-align:center;padding:6px 4px;border-radius:12px;border:2px solid var(--line-2);background:var(--surface);font-variant-numeric:tabular-nums;min-height:62px}
.numf input[type=text].wide{width:6.4ch}
.numf .unit{font-size:.9rem;color:var(--ink-2);min-width:4.2ch}
.numf.bad{box-shadow:inset 0 0 0 2px var(--crit)}
.ferr{color:var(--crit-ink);font-weight:700;font-size:.92rem}
.seglg{display:grid;grid-template-columns:repeat(auto-fit,minmax(0,1fr));gap:8px}
.seglg button,.pick{min-height:56px;border-radius:12px;border:2px solid var(--line-2);background:var(--surface);font-weight:700;font-size:1rem;cursor:pointer;padding:8px 10px;line-height:1.2}
.seglg button[aria-pressed="true"],.pick[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.picks{display:flex;flex-wrap:wrap;gap:8px}
.pick{min-height:50px;border-radius:999px;padding:8px 16px}
.painscale{display:grid;grid-template-columns:repeat(11,minmax(0,1fr));gap:6px}
@media (max-width:640px){.painscale{grid-template-columns:repeat(6,minmax(0,1fr))}}
.painscale button{min-height:58px;border-radius:12px;border:2px solid transparent;font-size:1.3rem;font-weight:700;cursor:pointer;color:var(--ink);font-variant-numeric:tabular-nums}
.painscale button[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 3px var(--surface) inset;transform:scale(1.04)}
.painscale .pz-good{background:var(--z-good)} .painscale .pz-ok{background:var(--z-ok)} .painscale .pz-warn{background:var(--z-warn)} .painscale .pz-serious{background:var(--z-serious)} .painscale .pz-crit{background:var(--z-crit)}
.pain-word{font-weight:700;font-size:1.05rem;min-height:1.6em}
.when{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:10px 12px;border-radius:12px;background:var(--surface-2)}
.when b{font-variant-numeric:tabular-nums}
.when .btn{min-height:44px;padding:6px 12px;font-size:.92rem}
.when-edit{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:10px;width:100%}
.when-edit label{display:flex;flex-direction:column;gap:4px;font-weight:700;font-size:.9rem}
textarea{min-height:96px;resize:vertical;line-height:1.45}
.howto{border-radius:12px;background:var(--surface-2);padding:10px 14px}
.howto summary{cursor:pointer;font-weight:700;color:var(--accent-deep);min-height:40px;display:flex;align-items:center}
.howto ol{margin:6px 0 4px;padding-left:24px;display:flex;flex-direction:column;gap:6px}
.result{display:flex;flex-direction:column;gap:12px;border-left:6px solid var(--accent)}
.result.good{border-left-color:var(--good)} .result.warn{border-left-color:var(--warn)} .result.crit{border-left-color:var(--crit)} .result.info{border-left-color:var(--accent)}
.result .r-top{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.result .r-val{display:flex;flex-direction:column;gap:2px}
.result .r-val b{font-size:1.7rem;line-height:1.2;font-variant-numeric:tabular-nums}
.result .r-val span{color:var(--ink-2)}
.result .r-adv{font-size:1.05rem}
.result .r-xp{display:inline-flex;align-items:center;gap:6px;color:var(--sun-deep);font-weight:700}
.celebrate{display:flex;align-items:center;gap:14px;padding:16px;border-radius:18px;background:var(--sun-soft);border:2px solid var(--sun)}
.celebrate .b-medal{width:64px;height:64px;flex:0 0 64px;background:var(--sun);color:#3d2600}
.celebrate .b-medal .ic{width:34px;height:34px}
.celebrate b{display:block;font-family:var(--serif);font-size:1.25rem}
.celebrate div{flex:1 1 auto;min-width:0}
.celebrate .btn{min-height:44px}

/* ===== send ===== */
.steps{margin:0;padding:0;list-style:none;counter-reset:st;display:flex;flex-direction:column;gap:10px}
.steps li{counter-increment:st;display:grid;grid-template-columns:40px minmax(0,1fr);gap:10px;align-items:start;font-size:1.02rem}
.steps li::before{content:counter(st);width:36px;height:36px;border-radius:50%;background:var(--accent-soft);color:var(--accent-deep);font-weight:700;display:grid;place-items:center}
#msg{font-size:.86rem;line-height:1.45;min-height:150px;background:var(--surface-2)}
.check-row{display:flex;align-items:center;gap:12px;min-height:52px;font-size:1rem;cursor:pointer}
.check-row input{width:28px;height:28px;flex:0 0 28px;accent-color:var(--accent)}

/* ===== history ===== */
.hist{display:flex;flex-direction:column;gap:14px}
.hday h3{font-size:1.08rem;margin-bottom:8px}
.hitems{display:flex;flex-direction:column;gap:8px;list-style:none;margin:0;padding:0}
.hitem{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px 12px;align-items:center;padding:10px 12px;border-radius:14px;background:var(--surface-2)}
.hitem .hi-ic{width:42px;height:42px;border-radius:12px;background:var(--surface);color:var(--accent);display:grid;place-items:center}
.hitem .hi-t{display:flex;flex-direction:column;gap:2px;min-width:0}
.hitem .hi-t b{font-size:1rem;line-height:1.35;overflow-wrap:anywhere}
.hitem .hi-t small{color:var(--ink-2);font-size:.85rem}
.hitem .hi-act{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.hitem .btn{min-height:40px;padding:4px 10px;font-size:.84rem;border-width:1px}
@media (max-width:520px){.hitem{grid-template-columns:auto minmax(0,1fr)}.hitem .hi-act{grid-column:1/-1;flex-direction:row;justify-content:space-between;align-items:center}}
.chart-wrap{position:relative}
.chart-wrap svg{display:block;width:100%;height:auto}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.88rem;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{display:inline-block;width:18px;height:4px;border-radius:2px}
.legend i.tg{height:0;border-top:2px dashed var(--good)}
.ctip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);font-size:.82rem;font-weight:700;padding:6px 10px;border-radius:8px;white-space:nowrap;transform:translate(-50%,-115%);z-index:3}
.ax{font:14px var(--ui);fill:var(--muted)}
.c-grid{stroke:var(--grid);stroke-width:1}
.c-tg{stroke:var(--good);stroke-width:2;stroke-dasharray:6 5}
.c-l0,.c-l1{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.c-l0{stroke:var(--s1)} .c-l1{stroke:var(--s2)}
.c-p0,.c-p1{stroke:var(--surface);stroke-width:2}
.c-p0{fill:var(--s1)} .c-p1{fill:var(--s2)}
.c-hit{fill:transparent;cursor:pointer}
.legend i.lg0{background:var(--s1)} .legend i.lg1{background:var(--s2)}
.foot{color:var(--muted);font-size:.84rem;display:flex;flex-direction:column;gap:6px;padding-top:6px;border-top:1px solid var(--line)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ===== daily page on the phone ===== */
.daily>.note{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;font-size:1rem}
.daily>.note .btn{min-height:48px}
.fc-habits{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.fc-habits li{display:grid;grid-template-columns:minmax(0,1fr) minmax(70px,90px) auto;align-items:center;gap:10px;font-size:.92rem}
.fc-habits b{font-variant-numeric:tabular-nums;min-width:2.6ch;text-align:right}
.welcome h3{display:flex;align-items:center;gap:8px}
.welcome .ic{color:var(--sun-deep)}

/* ===== v3: sửa số đo, trạng thái gửi ===== */
.edit-note{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px}
.edit-note .btn{min-height:46px}
.hi-btns{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end}
.note .ic.sm{vertical-align:-3px}

/* ===== chế độ nhúng: trang chạy trong khung của bảng theo dõi (?embed=1), khung tự co theo chiều cao nội dung ===== */
html.embed body{min-height:0;display:flex;flex-direction:column;background:transparent}
html.embed body::before{display:none}
html.embed .top,html.embed .toast{display:none}
html.embed main{padding-block:14px 8px}
html.embed main.wrap{padding-left:0;padding-right:0}
html.embed .bnav{position:static;order:-1;border:1px solid var(--line);border-radius:14px;box-shadow:none;overflow:hidden;padding:0}
html.embed .bnav button{min-height:64px}

/* ===== daily habits page (dashboard tab and home-entry page) ===== */
.daily{display:flex;flex-direction:column;gap:18px}
.dl-hero{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:18px 28px;align-items:center;padding:22px 24px;border-radius:20px;background:var(--hero);box-shadow:var(--shadow)}
.dl-hello{display:flex;flex-direction:column;gap:6px;min-width:0}
.dl-date{color:var(--ink-2);font-weight:600;font-size:1rem}
.dl-hello h2{font-size:clamp(1.9rem,4.6vw,2.6rem);color:var(--ink);letter-spacing:.2px}
.dl-motto{font-size:1.08rem;color:var(--ink-2);max-width:46ch}
.dl-stats{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px}
.dl-stat{display:inline-flex;align-items:center;gap:8px;background:var(--surface);border-radius:999px;padding:7px 14px 7px 10px;font-size:1rem;box-shadow:var(--shadow)}
.dl-stat .ic{color:var(--sun-deep);width:22px;height:22px}
.dl-stat b{font-size:1.12rem;font-variant-numeric:tabular-nums}
.dl-level{display:flex;flex-wrap:wrap;align-items:center;gap:12px 16px}
.lv-ring{width:128px;height:128px;flex:0 0 128px}
.lv-track{fill:var(--surface);stroke:var(--line);stroke-width:10}
.lv-fill{fill:none;stroke:var(--sun);stroke-width:10;stroke-linecap:round}
.lv-cap{font:700 12px var(--ui);letter-spacing:2px;fill:var(--ink-2)}
.lv-num{font:700 36px var(--ui);fill:var(--ink)}
.dl-lvtext{display:flex;flex-direction:column;gap:6px;min-width:min(190px,100%);flex:1 1 160px}
.dl-lvtext b{font-family:var(--serif);font-size:1.45rem;color:var(--accent-deep)}
.dl-xp{font-size:1.05rem;font-weight:700;font-variant-numeric:tabular-nums}
.dl-lvtext small{color:var(--ink-2);font-size:.95rem}
.dv-bar{display:block;height:12px;border-radius:999px;background:var(--surface-3);overflow:hidden;min-width:120px}
.dv-bar i{display:block;height:100%;border-radius:999px;background:var(--accent)}
.dv-bar.sun i{background:var(--sun)}
.dv-bar.good i{background:var(--good)}
.dl-prog{display:flex;align-items:center;gap:10px;min-width:220px;font-size:1rem}
.dl-prog .dv-bar{flex:1 1 140px}
.habits{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr));gap:10px}
.habits li{display:flex}
.habits li>.habit{flex:1 1 auto}
.daily .sec-head h3{display:flex;gap:8px;align-items:center}
.habit{width:100%;display:grid;grid-template-columns:auto auto minmax(0,1fr) auto;align-items:center;gap:12px;text-align:left;background:var(--surface-2);border:2px solid transparent;border-radius:16px;padding:12px 14px;min-height:76px;font:inherit;color:inherit}
button.habit{cursor:pointer}
button.habit:hover{border-color:var(--accent-line)}
button.habit:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.hb-check{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:2px solid var(--line-2);color:var(--muted)}
.hb-check .ic{width:22px;height:22px}
.hb-ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--surface);color:var(--accent)}
.hb-ic .ic{width:26px;height:26px}
.hb-txt{display:flex;flex-direction:column;gap:2px;min-width:0}
.hb-txt b{font-size:1.08rem;line-height:1.3}
.hb-txt small{color:var(--ink-2);font-size:.92rem;line-height:1.35}
.hb-xp{font-weight:700;color:var(--sun-deep);font-size:1rem;font-variant-numeric:tabular-nums}
.habit.done{background:var(--accent-soft);border-color:var(--accent-line)}
.habit.done .hb-check{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.habit.auto .hb-check{border-style:dashed}
.habit.auto.done .hb-check{border-style:solid}
.quests{display:flex;flex-direction:column;gap:14px}
.quest{display:flex;flex-direction:column;gap:6px}
.q-top{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.q-top b{font-size:1.04rem}
.q-xp{display:inline-flex;align-items:center;gap:4px;color:var(--sun-deep);font-weight:700;white-space:nowrap}
.quest small{color:var(--ink-2);font-variant-numeric:tabular-nums}
.quest.done .q-xp{color:var(--good-ink)}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.badge{display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;padding:12px 8px;border-radius:14px;background:var(--surface-2);color:var(--muted)}
.badge b{font-size:.98rem;color:var(--ink-2)}
.badge small{font-size:.85rem;line-height:1.3}
.b-medal{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;background:var(--surface-3);color:var(--muted)}
.b-medal .ic{width:28px;height:28px}
.badge.got{background:var(--sun-soft);color:var(--ink-2)}
.badge.got b{color:var(--ink)}
.badge.got .b-medal{background:var(--sun);color:#3d2600;box-shadow:0 0 0 4px var(--surface)}
.focus{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:12px}
.fc{display:flex;flex-direction:column;gap:10px}
.fc-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.fc-top b{font-family:var(--serif);font-size:1.18rem}
.fc-goal,.fc-tip{display:flex;gap:8px;align-items:flex-start;font-size:1rem}
.fc-goal{color:var(--accent-deep);font-weight:600}
.fc-tip{color:var(--ink-2)}
.fc-tip .ic{color:var(--good)}
.fc-now{display:flex;flex-direction:column;gap:2px}
.fc-now .big{font-size:1.8rem}
.remember{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:9px;font-size:1.02rem}
.dl-agenda{display:flex;flex-direction:column;gap:10px}
.ag-row{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:center}
.ag-row b{display:block;font-size:1.04rem}
.ag-row small{color:var(--ink-2);font-size:.95rem}
.dbox{width:58px;min-height:58px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--accent-soft);color:var(--accent-deep);line-height:1.1}
.dbox b{font-size:1.3rem}
.dbox small{font-size:.78rem;font-weight:600}
.dbox.todo{background:var(--sun-soft);color:var(--sun-deep)}
.dl-sos{display:flex;gap:14px;align-items:flex-start;padding:16px 18px;border-radius:16px;background:var(--crit-bg);color:var(--ink);font-size:1.02rem}
.dl-sos .ic{color:var(--crit-ink);flex:0 0 auto}
@media (max-width:720px){
  .dl-hero{grid-template-columns:1fr;padding:18px 16px}
  .dl-level{justify-content:flex-start}
  .lv-ring{width:108px;height:108px;flex-basis:108px}
  .habit{grid-template-columns:auto minmax(0,1fr) auto;padding:12px}
  .habit .hb-ic{display:none}
}

/* ===================== daily habits: shared engine (no DOM) =====================
   Used by the dashboard tab "Mỗi ngày" and by the home-entry page. Entries share one shape:
   {id, type: 'bp'|'pain'|'weight'|'glucose'|'symptom'|'meds'|'habit', t: ISO time, day?: 'YYYY-MM-DD', done?: [habit ids], ...}
   Days are counted in Vietnam time (UTC+7), where the persons live. */
var DG = (function () {
  var VN = 7 * 3600000;
  function dayOf(e) { if (e.day) return e.day; return new Date(Date.parse(e.t) + VN).toISOString().slice(0, 10); }
  function hourOf(t) { return new Date(Date.parse(t) + VN).getUTCHours(); }
  function todayVN() { return new Date(Date.now() + VN).toISOString().slice(0, 10); }
  function addDays(day, n) { var d = new Date(day + 'T00:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); }
  function weekStart(day) { var d = new Date(day + 'T00:00:00Z'), w = (d.getUTCDay() + 6) % 7; return addDays(day, -w); }   // Monday
  function noonISO(day) { return new Date(Date.parse(day + 'T12:00:00Z') - VN).toISOString(); }

  // group entries by VN day: {day: {habits: Set-like obj, bp: n, bpAm, bpPm, weight: n, glu: n, report: n}}
  function byDay(entries) {
    var m = {};
    entries.forEach(function (e) {
      if (!e || !e.t || e.deleted) return;
      var d = dayOf(e), x = m[d] || (m[d] = { habits: {}, bp: 0, bpAm: 0, bpPm: 0, weight: 0, glu: 0, report: 0, any: false });
      x.any = true;
      if (e.type === 'habit') (e.done || []).forEach(function (h) { x.habits[h] = 1; });
      else if (e.type === 'bp') { x.bp++; if (hourOf(e.t) < 12) x.bpAm++; else x.bpPm++; }
      else if (e.type === 'weight') x.weight++;
      else if (e.type === 'glucose') x.glu++;
      else if (e.type === 'pain' || e.type === 'symptom') x.report++;
      else if (e.type === 'meds') x.habits.med = 1;
    });
    return m;
  }
  function doneSet(cfg, dayRec) {
    var s = {};
    if (!dayRec) return s;
    Object.keys(dayRec.habits).forEach(function (h) { s[h] = 1; });
    cfg.habits.forEach(function (h) {
      if (h.auto === 'bp_am' && dayRec.bpAm) s[h.id] = 1;
      if (h.auto === 'bp_pm' && dayRec.bpPm) s[h.id] = 1;
    });
    return s;
  }
  function dayXP(cfg, game, dayRec) {
    if (!dayRec) return 0;
    var xp = 0, X = game.xp, done = doneSet(cfg, dayRec);
    cfg.habits.forEach(function (h) { if (!h.auto && done[h.id]) xp += h.xp; });
    xp += Math.min(dayRec.bp, X.bp_max) * X.bp;
    xp += Math.min(dayRec.weight, 1) * X.weight;
    xp += Math.min(dayRec.glu, X.glucose_max) * X.glucose;
    xp += Math.min(dayRec.report, 1) * X.report;
    return xp;
  }
  function questValue(q, days, ws) {
    var v = 0;
    for (var i = 0; i < 7; i++) {
      var r = days[addDays(ws, i)]; if (!r) continue;
      if (q.metric === 'bp_days') v += r.bp ? 1 : 0;
      else if (q.metric === 'bp_count') v += r.bp;
      else if (q.metric === 'weigh') v += r.weight;
      else if (q.metric.indexOf('habit:') === 0) v += r.habits[q.metric.slice(6)] ? 1 : 0;
    }
    return v;
  }
  function levelOf(game, xp) {
    var L = game.levels, i = 0;
    while (i + 1 < L.length && xp >= L[i + 1]) i++;
    var next = L[i + 1], cur = L[i];
    return { lv: i + 1, name: game.names[i], cur: cur, next: next || null, pct: next ? (xp - cur) / (next - cur) : 1, toNext: next ? next - xp : 0 };
  }
  function streaks(days, today) {
    var s = 0, d = days[today] && days[today].any ? today : addDays(today, -1);
    while (days[d] && days[d].any) { s++; d = addDays(d, -1); }
    var keys = Object.keys(days).filter(function (k) { return days[k].any; }).sort(), best = 0, run = 0, prev = null;
    keys.forEach(function (k) { run = prev && addDays(prev, 1) === k ? run + 1 : 1; best = Math.max(best, run); prev = k; });
    return { cur: s, best: best };
  }
  function bpAvgWindow(entries, endDay, n) {
    var from = addDays(endDay, -(n - 1)), xs = entries.filter(function (e) { var d = dayOf(e); return e.type === 'bp' && d >= from && d <= endDay; });
    if (!xs.length) return null;
    var s = 0, d = 0; xs.forEach(function (e) { s += e.sbp; d += e.dbp; });
    return { n: xs.length, sbp: s / xs.length, dbp: d / xs.length };
  }
  // the whole state for one person
  function compute(cfg, game, entries, today) {
    today = today || todayVN();
    var days = byDay(entries), keys = Object.keys(days).sort();
    var xp = 0, xpToday = dayXP(cfg, game, days[today]);
    keys.forEach(function (k) { xp += dayXP(cfg, game, days[k]); });
    // weekly quests: every week that has any activity
    var weeks = {}; keys.forEach(function (k) { weeks[weekStart(k)] = 1; });
    var questsDone = 0, weekBest = {};
    Object.keys(weeks).forEach(function (ws) {
      cfg.weekly.forEach(function (q) {
        var v = questValue(q, days, ws);
        weekBest[q.id] = Math.max(weekBest[q.id] || 0, v);
        if (v >= q.goal) { xp += q.xp; questsDone++; }
      });
    });
    var ws0 = weekStart(today);
    var quests = cfg.weekly.map(function (q) { var v = questValue(q, days, ws0); return { id: q.id, label: q.label, goal: q.goal, xp: q.xp, v: Math.min(v, q.goal), done: v >= q.goal }; });
    var st = streaks(days, today), lvl = levelOf(game, xp), done = doneSet(cfg, days[today]);
    var allDay = keys.some(function (k) { var ds = doneSet(cfg, days[k]); return cfg.habits.every(function (h) { return ds[h.id]; }); });
    var bpGood = false;
    keys.forEach(function (k) { var a = bpAvgWindow(entries, k, 7); if (a && a.n >= 5 && a.sbp < 130 && a.dbp < 80) bpGood = true; });
    var hid = cfg.habits.map(function (h) { return h.id; });
    var B = [
      ['first', 'Bước đầu tiên', 'Lần ghi nhận đầu tiên', keys.length > 0, 'star'],
      ['streak7', 'Một tuần bền bỉ', 'Chuỗi 7 ngày liên tục', st.best >= 7, 'flame'],
      ['allday', 'Ngày trọn vẹn', 'Làm đủ mọi việc trong một ngày', allDay, 'check'],
      ['walker', 'Đôi chân chăm chỉ', 'Đi bộ 5 ngày trong một tuần', (weekBest.q_walk || 0) >= 5, 'walk'],
      ['bpweek', 'Tuần đo đều', 'Hoàn thành nhiệm vụ đo huyết áp một tuần', !!cfg.weekly.filter(function (q) { return q.id === 'q_bp' && (weekBest.q_bp || 0) >= q.goal; }).length, 'cuff'],
      ['bpgood', 'Huyết áp đẹp', 'Trung bình 7 ngày dưới 130/80, từ 5 lần đo', bpGood, 'heart'],
      ['streak30', 'Một tháng kiên trì', 'Chuỗi 30 ngày liên tục', st.best >= 30, 'trophy'],
      ['level5', 'Lên cấp 5', 'Đạt cấp 5: Bền bỉ', lvl.lv >= 5, 'medal'],
    ];
    if (hid.indexOf('water') >= 0) B.splice(4, 0, ['water', 'Thận vui', 'Uống đủ nước 5 ngày trong một tuần', weekMax(days, 'water') >= 5, 'glass']);
    if (hid.indexOf('noalc') >= 0) B.splice(5, 0, ['noalc', 'Tuần thanh đạm', '5 ngày không bia rượu trong một tuần', weekMax(days, 'noalc') >= 5, 'nobeer']);
    if (hid.indexOf('calcium') >= 0) B.splice(4, 0, ['calcium', 'Xương chắc', 'Đủ calci 5 ngày trong một tuần', weekMax(days, 'calcium') >= 5, 'bone']);
    if (hid.indexOf('balance') >= 0) B.splice(5, 0, ['balance', 'Dáng vững', 'Tập thăng bằng 3 ngày trong một tuần', weekMax(days, 'balance') >= 3, 'balance']);
    var badges = B.map(function (b) { return { id: b[0], name: b[1], how: b[2], got: !!b[3], icon: b[4] }; });
    return { today: today, days: days, xp: xp, xpToday: xpToday, level: lvl, streak: st, done: done, quests: quests, questsDone: questsDone, badges: badges,
             doneCount: cfg.habits.filter(function (h) { return done[h.id]; }).length, total: cfg.habits.length, bp7: bpAvgWindow(entries, today, 7) };
  }
  function weekMax(days, hidv) {
    var weeks = {}; Object.keys(days).forEach(function (k) { if (days[k].habits[hidv]) { var w = weekStart(k); weeks[w] = (weeks[w] || 0) + 1; } });
    var m = 0; Object.keys(weeks).forEach(function (w) { m = Math.max(m, weeks[w]); }); return m;
  }
  return { compute: compute, dayOf: dayOf, todayVN: todayVN, addDays: addDays, weekStart: weekStart, noonISO: noonISO, hourOf: hourOf, levelOf: levelOf, byDay: byDay };
})();

function saveEntry() {
  var k = ST.kind, f = F(), errs = {}, e = { type: k }, t = null, old = ST.editId ? findEntry(ST.editId) : null;
  if (old && ST.when.edit && ST.editWhen && ST.when.date === ST.editWhen.date && ST.when.time === ST.editWhen.time) t = old.t;   // giữ nguyên giờ đo cũ

    var d = ST.when.date && ST.when.time ? new Date(ST.when.date + 'T' + ST.when.time) : null;
    if (!d) errs.when = 'Chọn đủ ngày và giờ đo.';
    else if (isNaN(d.getTime())) errs.when = 'Ngày giờ chưa đúng.';
    else if (d.getTime() > Date.now() + 5 * 60000) errs.when = 'Giờ đo không được sau giờ hiện tại.';
    else if (d.getTime() < Date.now() - 62 * 86400000) errs.when = 'Chỉ ghi được số đo trong 2 tháng gần đây.';
    else t = d.toISOString();

    var s = numIn(f.sbp), dd = numIn(f.dbp), hr = numIn(f.hr);
    if (s == null) errs.sbp = 'Nhập số trên.'; else if (!int(s, 60, 260)) errs.sbp = 'Số trên thường từ 60 đến 260, số nguyên.';
    if (dd == null) errs.dbp = 'Nhập số dưới.'; else if (!int(dd, 30, 160)) errs.dbp = 'Số dưới thường từ 30 đến 160, số nguyên.';
    if (!errs.sbp && !errs.dbp && dd >= s) errs.dbp = 'Số dưới phải nhỏ hơn số trên; kiểm tra lại.';
    if (hr != null && !int(hr, 30, 220)) errs.hr = 'Mạch thường từ 30 đến 220.';
    e.sbp = s; e.dbp = dd; if (hr != null) e.hr = hr; e.arm = f.arm;

  } else if (k === 'weight') {

    if (w != null && !(w >= 25 && w <= 250)) errs.weight = 'Cân nặng thường từ 25 đến 250 kg.';
    if (wa != null && !(wa >= 40 && wa <= 200)) errs.waist = 'Vòng eo thường từ 40 đến 200 cm.';
    if (w != null) e.weight = Math.round(w * 10) / 10; if (wa != null) e.waist = Math.round(wa * 10) / 10;
  } else if (k === 'glucose') {
    var g = numIn(f.glu);

    else { if (g > 35) g = g / 18.016; e.glu = Math.round(g * 10) / 10; }

  } else {

  ST.errs = errs;
  if (Object.keys(errs).length) { render(); var bad = document.querySelector('.numf.bad input, .ferr'); if (bad) { bad.scrollIntoView({ block: 'center' }); if (bad.focus) bad.focus(); } return; }
  var b = stateNow(), list = mine().entries;
  if (old) { e.id = old.id; e.code = old.code; e.rev = (old.rev || 1) + 1; list[list.indexOf(old)] = e; }
  else { e.code = newCode(); e.id = e.code; e.rev = 1; list.push(e); }

  render(); toTop();
}

// the Zalo link opens a new tab right after the tap, so the message is copied synchronously first
function zaloCopy() {
  var ta = $('#msg'); if (!ta) return;
  var ok = false;
  try { ta.focus(); ta.select(); ta.setSelectionRange(0, ta.value.length); ok = !!(document.execCommand && document.execCommand('copy')); } catch (e) { ok = false; }
  if (ok) { setZalo(true); return; }

    else setZalo(false);

}

    : 'Máy chưa cho chép tự động. Bấm giữ vào ô tin nhắn ở trên, chọn Chọn tất cả rồi Sao chép, sau đó dán vào khung chat Zalo với ' + DOC + '.';

function doCopy() {
  var ta = $('#msg'); if (!ta) return;
  function fallback() {
    var ok = false;
    try { ta.focus(); ta.select(); ta.setSelectionRange(0, ta.value.length); ok = !!(document.execCommand && document.execCommand('copy')); } catch (e) { ok = false; }
    setCopy(ok);
  }
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(ta.value).then(function () { setCopy(true); }, fallback);
    else fallback();
  } catch (e) { fallback(); }

var TYPE_IC = { bp: 'cuff', pain: 'face', weight: 'scale', glucose: 'drop', symptom: 'thermo', habit: 'check' };

function bpChartHTML(list, today) {
  var W = chartW(), H = W < 480 ? 230 : 260, L = 40, R = 40, T = 16, B = 34, from = DG.addDays(today, -13), step = W < 480 ? 4 : 2;
  var t0 = Date.parse(from + 'T00:00:00Z') - 7 * 3600000, t1 = Date.parse(today + 'T00:00:00Z') - 7 * 3600000 + 86400000;
  var lo = 60, hi = 160;
  list.forEach(function (e) { lo = Math.min(lo, Math.floor((e.dbp - 5) / 10) * 10); hi = Math.max(hi, Math.ceil((e.sbp + 5) / 10) * 10); });
  function X(t) { return (L + (Date.parse(t) - t0) / (t1 - t0) * (W - L - R)).toFixed(1); }
  function Y(v) { return (T + (hi - v) / (hi - lo) * (H - T - B)).toFixed(1); }

  for (var v = Math.ceil(lo / 20) * 20; v <= hi; v += 20) g += '<line class="c-grid" x1="' + L + '" x2="' + (W - R) + '" y1="' + Y(v) + '" y2="' + Y(v) + '"/><text class="ax" x="' + (L - 8) + '" y="' + (+Y(v) + 4) + '" text-anchor="end">' + v + '</text>';
  for (var i = 13; i >= 0; i -= step) { var day = DG.addDays(from, i), x = X(new Date(Date.parse(day + 'T12:00:00Z') - 7 * 3600000).toISOString()); g += '<text class="ax" x="' + x + '" y="' + (H - 12) + '" text-anchor="middle">' + dvDate(day).slice(0, 5) + '</text>'; }
  [[130, 'Mục tiêu 130'], [80, 'Mục tiêu 80']].forEach(function (tg) { g += '<line class="c-tg" x1="' + L + '" x2="' + (W - R) + '" y1="' + Y(tg[0]) + '" y2="' + Y(tg[0]) + '"/><text class="ax" x="' + (W - R + 6) + '" y="' + (+Y(tg[0]) + 4) + '">' + tg[0] + '</text>'; });
  ['sbp', 'dbp'].forEach(function (k, si) {

    g += list.map(function (e) { return '<circle class="c-p' + si + '" cx="' + X(e.t) + '" cy="' + Y(e[k]) + '" r="5"/>'; }).join('');
  });
  var last = list[list.length - 1];
  g += list.map(function (e, j) { return '<circle class="c-hit" data-tip="' + j + '" cx="' + X(e.t) + '" cy="' + ((+Y(e.sbp) + +Y(e.dbp)) / 2).toFixed(1) + '" r="18"><title>' + esc(dvDate(DG.dayOf(e)).slice(0, 5) + ' ' + localTime(e.t) + ': ' + e.sbp + '/' + e.dbp) + '</title></circle>'; }).join('');
  var lg = '<div class="legend"><span><i class="lg0"></i>Số trên</span><span><i class="lg1"></i>Số dưới</span><span><i class="tg"></i>Mục tiêu dưới 130/80</span></div>';
  var tips = list.map(function (e) { return [((+X(e.t)) / W * 100).toFixed(2), ((+Y(e.sbp)) / H * 100).toFixed(2), dvDate(DG.dayOf(e)).slice(0, 5) + ', ' + localTime(e.t) + ': ' + e.sbp + '/' + e.dbp + (e.hr ? ', mạch ' + e.hr : '')]; });
  return lg + '<div class="chart-wrap" data-tips="' + esc(JSON.stringify(tips)) + '"><svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Huyết áp 14 ngày qua, ' + list.length + ' lần đo; lần gần nhất ' + last.sbp + '/' + last.dbp + '">' + g + '</svg><div class="ctip" hidden></div></div>' +
    '<p class="small muted">Lần gần nhất: <b>' + last.sbp + '/' + last.dbp + '</b> mmHg. Chạm vào điểm để xem số.</p>';

      return '<li class="hitem"><span class="hi-ic">' + ic(TYPE_IC[e.type] || 'note') + '</span><div class="hi-t"><b>' + esc(valueText(e)) + '</b><small>' + esc(e.type === 'habit' ? 'Thói quen trong ngày' : 'Lúc ' + localTime(e.t)) + (e.note ? '; ' + esc(e.note) : '') + (e.rev > 1 && e.type !== 'habit' ? '; đã sửa' : '') + '</small></div>' +
        '<div class="hi-act">' + syncChip(e) + '<span class="hi-btns">' + (e.type !== 'habit' && !del ? '<button type="button" class="btn btn-ghost" data-edit="' + esc(e.id) + '">' + ic('note', 'sm') + 'Sửa</button>' : '') +
        '<button type="button" class="btn ' + (del ? 'btn-danger' : 'btn-ghost') + '" data-del="' + esc(e.id) + '">' + ic('trash', 'sm') + (del ? 'Bấm lần nữa để xoá' : 'Xoá') + '</button></span></div></li>';
    }).join('') + '</ul></section>';
  }).join('') + '</div>';
  if (order.length > ST.histDays) h += '<button type="button" class="btn" data-act="more">Xem thêm ngày cũ</button>';
  return h + '<p class="small muted">' + (SYNC.storeStatus(ST.pid).tok && !SYNC.storeStatus(ST.pid).bad ? 'Lịch sử này giống nhau trên mọi điện thoại mở bằng liên kết riêng của ' + pron() + '. ' + DOC + ' cũng xem được mọi lần nhập.'
    : DOC + ' xem được mọi lần nhập, kể cả từ điện thoại khác; trang này chỉ hiện các lần nhập trên điện thoại đang dùng.') + '</p>';
}
function delEntry(id) {
  if (ST.del !== id) { ST.del = id; clearTimeout(ST.delTimer); ST.delTimer = setTimeout(function () { ST.del = null; if (ST.screen === 'history') render(); }, 6000); render(); return; }
  var p = mine(), e = findEntry(id);
  p.entries = p.entries.filter(function (x) { return x.id !== id; }); delete p.sent[id];
  if (e) { e.rev = (e.rev || 1) + 1; SYNC.put(ST.pid, e, 'delete', 0); }   // bản xoá mang số lần sửa cao nhất
  ST.del = null; persist(); toast('Đã xoá'); render();
}

/* ---------- khung trang ---------- */
function chooserHTML() {
  return '<section class="chooser"><h2>Ai đang dùng sổ này?</h2><p class="muted">Mỗi người có sổ riêng; nhiều người dùng chung một điện thoại vẫn được.</p><div class="who-grid">' +
    PEOPLE_IDS.map(function (p) { return '<button type="button" class="who" data-who="' + p + '"><span class="av">' + ic('person') + '</span>' + esc(CONF.people[p].greet) + '</button>'; }).join('') + '</div></section>';
}
function footHTML() {
  if (EMBED) return '';
  return '<footer class="foot"><span>Trang này không chứa hồ sơ bệnh án. Số đo ' + pron() + ' nhập được gửi về hệ thống theo dõi của ' + DOC + ' khi bấm Lưu' + (DOC_ZALO ? '; Zalo của ' + DOC + ': ' + zaloFmt(DOC_ZALO) : '') + '.</span><span>Cấp cứu: gọi 115. ' + (CONF.page_version ? 'Phiên bản ' + esc(CONF.page_version) + ', c' : 'C') + 'ập nhật ' + dvDate(CONF.generated) + '.</span></footer>';
}
function render() {
  var y = window.scrollY, m = $('#main'), nav = $('#bnav'), ae = document.activeElement, key = null;
  if (ae && ae !== document.body) { if (ae.id) key = '#' + ae.id; else { for (var a = ae.attributes, i = 0; i < a.length; i++) if (/^data-/.test(a[i].name)) { key = '[' + a[i].name + '="' + a[i].value.replace(/"/g, '\\"') + '"]'; break; } } }
  if (!ST.pid) { m.innerHTML = chooserHTML(); nav.hidden = true; $('#who-name').textContent = ''; $('#who-switch').hidden = true; return; }
  nav.hidden = false; $('#who-switch').hidden = PEOPLE_IDS.length < 2; $('#who-name').textContent = who().greet;
  var h = ST.screen === 'entry' ? entryHTML() : ST.screen === 'send' ? sendHTML() : ST.screen === 'history' ? historyHTML() : todayHTML();
  m.innerHTML = '<div class="screen">' + h + footHTML() + '</div>';
  nav.querySelectorAll('button[data-screen]').forEach(function (b) { if (b.getAttribute('data-screen') === ST.screen) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current'); });
  navCount();
  keepY(y);
  reportSize();
  if (key) { try { var el = document.querySelector(key); if (el) el.focus({ preventScroll: true }); } catch (e) { /* focus is a convenience */ } }
}
function go(screen) {
  if (screen !== 'entry' || ST.screen === 'entry') endEdit();
  ST.screen = screen; ST.errs = {}; ST.del = null;
  if (screen !== 'entry') ST.result = null;
  render(); toTop();
}
function choose(pid) { endEdit(); ST.pid = pid; ST.screen = 'today'; ST.result = null; ST.celebrate = null; ST.form = {}; ST.errs = {}; persist(); render(); toTop(); }

document.addEventListener('click', function (ev) {
  var za = ev.target.closest && ev.target.closest('a[data-zalo]'); if (za) { zaloCopy(); return; }   // the link itself then opens the chat
  var b = ev.target.closest('button, [data-tip]'); if (!b) return;
  var d = b.dataset || {};
  if (d.tip != null) { showTip(+d.tip, b); return; }
  if (d.who) { choose(d.who); return; }
  if (b.id === 'who-switch') { ST.pid = null; render(); toTop(); return; }
  if (d.screen) { go(d.screen); return; }
  if (d.goEntry) { ST.kind = d.goEntry; ST.result = null; go('entry'); return; }
  if (d.habit) { toggleHabit(d.habit); return; }
  if (d.kind) { ST.kind = d.kind; ST.errs = {}; ST.result = null; render(); return; }
  if (d.arm) { F().arm = d.arm; render(); return; }
  if (d.pain != null) { F().pain = +d.pain; delete ST.errs.pain; render(); return; }
  if (d.loc) { toggleIn(F().loc, d.loc); render(); return; }
  if (d.pk) { toggleIn(F().kind, d.pk); render(); return; }
  if (d.ctx) { F().ctx = d.ctx; render(); return; }
  if (d.sym) { toggleIn(F().sym, d.sym); delete ST.errs.sym; render(); return; }
  if (d.sev) { F().sev = F().sev === d.sev ? '' : d.sev; render(); return; }
  if (d.del) { delEntry(d.del); return; }
  if (d.edit) { startEdit(d.edit); return; }
  var act = d.act;
  if (act === 'cel-close') { ST.celebrate = null; render(); }
  else if (act === 'result-close') { ST.result = null; render(); }
  else if (act === 'when-edit') { var p = localParts(new Date()); ST.when = { edit: true, date: p.date, time: p.time }; render(); }
  else if (act === 'when-now') { ST.when = { edit: false, date: '', time: '' }; delete ST.errs.when; render(); }
  else if (act === 'edit-cancel') { endEdit(); go('history'); }
  else if (act === 'copy') doCopy();
  else if (act === 'sync-retry') { SYNC.retry(); toast('Đang gửi lại'); setTimeout(render, 400); }
  else if (act === 'sync-ack') { SYNC.state().ack = new Date().toISOString(); persist(); render(); }
  else if (act === 'more') { ST.histDays += 21; render(); }
});
document.addEventListener('pointerover', function (ev) { var t = ev.target.closest && ev.target.closest('[data-tip]'); if (t && ev.pointerType === 'mouse') showTip(+t.getAttribute('data-tip'), t); });
document.addEventListener('input', function (ev) {
  var t = ev.target;
  if (t.dataset && t.dataset.f) { F()[t.dataset.f] = t.value; if (ST.errs[t.dataset.f]) { delete ST.errs[t.dataset.f]; var l = t.closest('.numf'); if (l) l.classList.remove('bad'); } }
  if (t.dataset && t.dataset.w) ST.when[t.dataset.w] = t.value;
});
document.addEventListener('change', function (ev) { if (ev.target.id === 'resend') { ST.resend = ev.target.checked; render(); } });
document.addEventListener('submit', function (ev) { if (ev.target.id === 'f-entry') { ev.preventDefault(); saveEntry(); } });
document.addEventListener('visibilitychange', function () { if (!document.hidden && ST.pid && ST.screen !== 'entry') render(); });
window.addEventListener('hashchange', function () { var p = takeHash(); if (p && p !== ST.pid) choose(p); });
(function init() {
  var o = load(), p = takeHash();
  ST.pid = p || (o && CONF.people[o.last] ? o.last : null) || (PEOPLE_IDS.length === 1 ? PEOPLE_IDS[0] : null);
  SYNC.reconcile(ST.data);   // mục nào chưa chắc đã tới hệ thống thì xếp gửi lại
  persist();
  render();
  SYNC.retry();
})();

</script>
</body>
</html>
